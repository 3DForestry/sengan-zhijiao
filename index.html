<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<title>森感·智教 | 森林多场景传感器感知仿真教学智能体</title>
<style>
:root{
  --f-deep:#0b1a10; --f-dark:#10271a; --f-mid:#164027; --f-leaf:#2f8c4c;
  --f-glow:#4fbf6e; --f-neon:#74e69a; --amber:#e6a532; --amber-hot:#f0682e;
  --blue:#4aa3d4; --red:#d9584a; --violet:#9a7ce0;
  --ok:#3fbf6a; --warn:#e6a532; --crit:#e8583f; --cold:#4aa3d4;
  --bg:#0c1710; --bg-2:#11271a; --panel:rgba(18,42,27,.72); --panel-solid:#12271b;
  --border:rgba(96,190,120,.22); --border-strong:rgba(96,190,120,.4);
  --ink:#dff3e4; --ink-2:#9dc4a9; --ink-3:#6f9a7d;
  --accent:var(--f-neon); --shadow:0 8px 30px rgba(0,0,0,.35);
  --serif:'Songti SC','宋体','SimSun',serif;
  --sans:'PingFang SC','微软雅黑','Microsoft YaHei',system-ui,sans-serif;
  --mono:'Cascadia Code','Consolas','Courier New',monospace;
  --r:12px;
}
:root[data-theme="light"]{
  --bg:#f3f0e7; --bg-2:#ece7db; --panel:#ffffff; --panel-solid:#ffffff;
  --border:rgba(90,120,80,.22); --border-strong:rgba(90,120,80,.4);
  --ink:#22301f; --ink-2:#4d6349; --ink-3:#7a8f76;
  --accent:#2f8c4c; --shadow:0 6px 22px rgba(40,50,30,.1);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3f0e7; --bg-2:#ece7db; --panel:#ffffff; --panel-solid:#ffffff;
    --border:rgba(90,120,80,.22); --border-strong:rgba(90,120,80,.4);
    --ink:#22301f; --ink-2:#4d6349; --ink-3:#7a8f76; --accent:#2f8c4c;
    --shadow:0 6px 22px rgba(40,50,30,.1);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 15% 0%,rgba(47,140,76,.14),transparent 55%),
    radial-gradient(ellipse at 85% 100%,rgba(230,165,50,.08),transparent 55%);}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;text-wrap:balance;letter-spacing:.02em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:420px;background:var(--panel);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow)}
.brand{text-align:center;margin-bottom:26px}
.brand .logo{font-size:2.6rem;filter:drop-shadow(0 0 14px var(--f-glow))}
.brand h1{font-size:1.5rem;color:var(--accent);letter-spacing:.14em;margin-top:6px}
.brand p{font-size:.78rem;color:var(--ink-3);letter-spacing:.14em;margin-top:4px}
.field{margin-bottom:15px}
.field label{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:10px;color:var(--ink);font-size:.92rem;outline:none;transition:border .2s}
.field input:focus,.field select:focus{border-color:var(--accent)}
.role-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.role-tabs button{flex:1;padding:9px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:10px;color:var(--ink-2);font-size:.88rem;transition:.2s}
.role-tabs button.on{background:var(--f-mid);border-color:var(--accent);color:var(--accent);font-weight:600}
:root[data-theme="light"] .role-tabs button.on{background:#e7f3ea}
.btn{padding:11px 18px;border:1px solid var(--border-strong);background:var(--f-mid);color:var(--f-neon);
  border-radius:10px;font-size:.9rem;transition:.2s;letter-spacing:.04em}
:root[data-theme="light"] .btn{background:#e7f3ea;color:#2f8c4c}
.btn:hover{background:var(--f-leaf);color:#fff;box-shadow:0 0 14px rgba(79,191,110,.3)}
.btn.primary{width:100%;background:linear-gradient(135deg,var(--f-leaf),var(--f-glow));color:#062;border:none;
  font-weight:700;font-size:1rem;padding:13px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.btn.warn{border-color:var(--amber-hot);color:var(--amber-hot);background:transparent}
.auth-alt{text-align:center;margin-top:16px;font-size:.82rem;color:var(--ink-3)}
.auth-alt a{color:var(--accent);cursor:pointer;text-decoration:underline}
.hint-box{margin-top:16px;padding:10px 12px;background:var(--bg-2);border:1px dashed var(--border);
  border-radius:10px;font-size:.75rem;color:var(--ink-3);line-height:1.7}
.err{color:var(--red);font-size:.8rem;margin-top:8px;min-height:1em}
.app{display:none;grid-template-columns:236px 1fr;min-height:100vh}
.app.on{display:grid}
.side{background:var(--panel-solid);border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.side-brand .logo{font-size:1.7rem}
.side-brand b{font-family:var(--serif);color:var(--accent);letter-spacing:.1em;font-size:1.05rem}
.side-brand small{display:block;color:var(--ink-3);font-size:.62rem;letter-spacing:.08em}
.nav{padding:12px 10px;flex:1}
.nav-group{font-size:.68rem;color:var(--ink-3);letter-spacing:.15em;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-2);
  font-size:.9rem;cursor:pointer;transition:.15s;margin-bottom:2px}
.nav a .ic{font-size:1.05rem;width:20px;text-align:center}
.nav a:hover{background:var(--bg-2);color:var(--ink)}
.nav a.on{background:var(--f-mid);color:var(--f-neon);font-weight:600}
:root[data-theme="light"] .nav a.on{background:#e7f3ea;color:#2f8c4c}
.side-foot{padding:12px;border-top:1px solid var(--border)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border);
  background:var(--panel);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.topbar h2{font-size:1.15rem}
.topbar .sub{font-size:.76rem;color:var(--ink-3)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:.76rem;
  border:1px solid var(--border)}
.pill.role{background:var(--f-mid);color:var(--f-neon)}
:root[data-theme="light"] .pill.role{background:#e7f3ea;color:#2f8c4c}
.pill.teacher{background:rgba(230,165,50,.16);color:var(--amber);border-color:rgba(230,165,50,.4)}
.iconbtn{width:36px;height:36px;border-radius:9px;background:var(--bg-2);border:1px solid var(--border);
  color:var(--ink-2);font-size:1rem;display:grid;place-items:center;transition:.2s}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.view{padding:26px;max-width:1180px;width:100%;margin:0 auto;flex:1}
.panel-c{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px;
  backdrop-filter:blur(6px)}
.card-title{font-size:1rem;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card-title::before{content:'';width:3px;height:15px;background:var(--accent);border-radius:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
.stat .big{font-family:var(--mono);font-size:1.9rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.stat .big.amber{color:var(--amber)}.stat .big.blue{color:var(--blue)}.stat .big.red{color:var(--red)}
.stat .lbl{font-size:.78rem;color:var(--ink-3);margin-top:7px}
.stat .ic{float:right;font-size:1.3rem;opacity:.5}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:.72rem;border:1px solid}
.tag.ok{color:var(--ok);border-color:rgba(63,191,106,.4);background:rgba(63,191,106,.1)}
.tag.warn{color:var(--warn);border-color:rgba(230,165,50,.4);background:rgba(230,165,50,.1)}
.tag.crit{color:var(--crit);border-color:rgba(232,88,63,.4);background:rgba(232,88,63,.1)}
.tag.cold{color:var(--cold);border-color:rgba(74,163,212,.4);background:rgba(74,163,212,.1)}
.tag.info{color:var(--ink-2);border-color:var(--border)}
.tag.violet{color:var(--violet);border-color:rgba(154,124,224,.4);background:rgba(154,124,224,.1)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;padding:9px 12px;color:var(--ink-3);font-weight:normal;font-size:.78rem;
  border-bottom:1px solid var(--border-strong)}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg-2)}
.muted{color:var(--ink-3)}
.tbl-wrap{overflow-x:auto}
select.ctl,input.ctl{padding:8px 12px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:9px;color:var(--ink);font-size:.85rem;outline:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar-track{height:8px;background:var(--bg-2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--f-leaf),var(--f-glow));border-radius:5px;transition:width .5s}
.empty{text-align:center;padding:40px;color:var(--ink-3)}
.empty .ic{font-size:2.4rem;opacity:.5;display:block;margin-bottom:8px}
.chapter-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.chapter-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.chapter-card .cnum{position:absolute;right:12px;top:8px;font-size:2rem;opacity:.85}
.chapter-card h4{font-size:1rem;padding-right:40px}
.chapter-card p{font-size:.78rem;color:var(--ink-3);margin-top:8px;line-height:1.7}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 140px)}
.chat-body{flex:1;overflow-y:auto;padding:8px 4px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:11px;max-width:82%}
.msg .av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .bubble{padding:11px 15px;border-radius:13px;font-size:.9rem;line-height:1.7}
.msg.bot .av{background:var(--f-mid)}
.msg.bot .bubble{background:var(--panel);border:1px solid var(--border);border-top-left-radius:3px}
.msg.user .av{background:rgba(230,165,50,.2)}
.msg.user .bubble{background:var(--f-mid);color:var(--ink);border-top-right-radius:3px}
:root[data-theme="light"] .msg.user .bubble{background:#e7f3ea}
.msg .bubble h4{font-size:.92rem;color:var(--accent);margin:2px 0 6px}
.msg .bubble ul{margin:6px 0 6px 18px}.msg .bubble li{margin:3px 0}
.msg .src{font-size:.72rem;color:var(--ink-3);margin-top:8px;padding-top:6px;border-top:1px dashed var(--border)}
.chat-suggest{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 13px;background:var(--bg-2);border:1px solid var(--border);border-radius:18px;
  font-size:.8rem;color:var(--ink-2);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chat-input{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--border)}
.chat-input input{flex:1;padding:12px 15px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:12px;color:var(--ink);font-size:.92rem;outline:none}
.chat-input input:focus{border-color:var(--accent)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin:0 2px;
  animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.sim-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 18px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px}
.sensor-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.sensor-card.alert{border-color:rgba(232,88,63,.6);box-shadow:0 0 18px rgba(232,88,63,.15)}
.sensor-card.cold{border-color:rgba(74,163,212,.5)}
.sensor-card .sid{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.sensor-card .loc{font-size:.9rem;margin:2px 0 10px}
.gauge{text-align:center;margin:6px 0}
.gauge .ring{width:92px;height:92px;margin:0 auto;position:relative}
.gauge svg{transform:rotate(-90deg);width:100%;height:100%}
.gauge .tv{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.gauge .num{font-family:var(--mono);font-size:1.35rem;font-weight:bold}
.gauge .u{font-size:.65rem;color:var(--ink-3)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.mini-stats .k{font-size:.66rem;color:var(--ink-3)}
.mini-stats .v{font-family:var(--mono);font-size:.85rem}
.log{height:230px;overflow-y:auto;font-family:var(--mono);font-size:.74rem;line-height:1.6}
.log .ln{padding:3px 0;border-bottom:1px solid var(--border);color:var(--ink-3)}
.log .ln.warn{color:var(--warn)}.log .ln.hot{color:var(--amber-hot)}.log .ln.cold{color:var(--cold)}.log .ln.ok{color:var(--ok)}
.log .t{color:var(--ink-3);margin-right:6px}
.scenario-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.sc-card{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.2s;background:var(--panel)}
.sc-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.sc-card.on{border-color:var(--accent);box-shadow:0 0 16px rgba(79,191,110,.2)}
.sc-card .hd{height:74px;display:grid;place-items:center;font-size:2.2rem}
.sc-fire .hd{background:linear-gradient(135deg,#3a1a0a,#8b2010)}
.sc-frost .hd{background:linear-gradient(135deg,#0a1a3a,#1a4a6a)}
.sc-storm .hd{background:linear-gradient(135deg,#2a2a3a,#3a3a55)}
.sc-card .bd{padding:12px 14px}
.sc-card .bd b{font-size:.92rem}.sc-card .bd p{font-size:.76rem;color:var(--ink-3);margin-top:4px;line-height:1.6}
textarea.ta{width:100%;min-height:120px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:10px;color:var(--ink);font-size:.9rem;outline:none;resize:vertical;line-height:1.7}
textarea.ta:focus{border-color:var(--accent)}
.moral{background:linear-gradient(135deg,rgba(47,140,76,.12),rgba(74,163,212,.06));
  border:1px solid var(--border);border-left:3px solid var(--f-leaf);border-radius:8px;padding:12px 15px;
  font-size:.84rem;color:var(--ink-2);line-height:1.8;margin-top:14px}
.moral b{color:var(--f-glow)}
.slider-row{margin:14px 0}
.slider-row label{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px}
.slider-row label b{font-family:var(--mono);color:var(--accent)}
.slider-row input[type=range]{width:100%;accent-color:var(--f-leaf)}
.out-card{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center}
.out-card .ov{font-family:var(--mono);font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.out-card .ov.amber{color:var(--amber)}.out-card .ov.red{color:var(--red)}.out-card .ov.blue{color:var(--blue)}.out-card .ov.cold{color:var(--cold)}
.out-card .ol{font-size:.76rem;color:var(--ink-3);margin-top:5px}
.formula{font-family:var(--mono);background:var(--bg-2);padding:10px 14px;border-radius:8px;font-size:.84rem;border-left:3px solid var(--accent);margin:8px 0;overflow-x:auto}
.quiz-q{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.quiz-q .qh{font-size:.95rem;margin-bottom:14px;line-height:1.7}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1px solid var(--border);
  border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s;font-size:.88rem}
.opt:hover{border-color:var(--border-strong);background:var(--bg-2)}
.opt.sel{border-color:var(--accent);background:var(--f-mid)}
:root[data-theme="light"] .opt.sel{background:#e7f3ea}
.opt.right{border-color:var(--ok);background:rgba(63,191,106,.12)}
.opt.wrong{border-color:var(--crit);background:rgba(232,88,63,.12)}
.opt .k{font-family:var(--mono);color:var(--ink-3);font-weight:bold}
.explain{margin-top:10px;padding:11px 14px;background:var(--bg-2);border-radius:9px;font-size:.82rem;
  color:var(--ink-2);line-height:1.7;border-left:3px solid var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:16px;padding:26px;
  max-width:520px;width:100%;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}
.modal h3{color:var(--accent);margin-bottom:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-solid);
  border:1px solid var(--border-strong);border-radius:10px;padding:12px 20px;font-size:.88rem;
  box-shadow:var(--shadow);z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
/* 智能模块：掌握度条 / 学习路径卡 / 朗读链接 */
.mastery-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:6px}
.mastery-cell{cursor:pointer}
.mastery-cell .lbl{display:flex;justify-content:space-between;gap:4px;font-size:.7rem;color:var(--ink-2);margin-top:4px;white-space:nowrap;overflow:hidden}
.path-card{padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg-2);border-left-width:4px}
.path-card.crit{border-left-color:var(--crit)}.path-card.warn{border-left-color:var(--amber)}.path-card.info{border-left-color:var(--blue)}.path-card.ok{border-left-color:var(--ok)}
.path-card .row{flex-wrap:wrap;gap:6px}
.msg .src .speak{cursor:pointer;color:var(--accent);margin-left:6px}
.chat-input .iconbtn{flex:none;width:44px;height:44px;font-size:1.05rem}
@media (max-width:920px){
  .mastery-strip{grid-template-columns:repeat(4,1fr)}
  .app.on{grid-template-columns:1fr}
  .side{position:fixed;left:-260px;z-index:60;transition:.25s;width:236px}
  .side.open{left:0}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .scenario-pick{grid-template-columns:1fr}
  .view{padding:16px}
}
</style>

    <div class="brand">
      <div class="logo">🌲</div>

<script>
/* ============================================================
   森感·智教 — 森林多场景传感器感知仿真教学智能体（单文件版）
   八大知识专题 + 多场景仿真；教/学/管/评/研五位一体
   数据层 localStorage · 角色分学生/教师 · 本地知识库 + 可接入大模型
   ============================================================ */
const DB={
  k:{users:'sgzj_users',session:'sgzj_session',acts:'sgzj_acts',subs:'sgzj_subs',
     quiz:'sgzj_quizlog',sims:'sgzj_sims',ai:'sgzj_ai',ext:'sgzj_ext'},
  _mem:{},
  get(k,d){
    try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v);}catch(e){}
    if(k in this._mem)return this._mem[k];
    return d;
  },
  set(k,v){this._mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
    if(typeof NET!=='undefined')NET.onSet(k,v);},
  del(k){delete this._mem[k];try{localStorage.removeItem(k);}catch(e){}},
};
/* ============================================================
   NET · 课堂服务器同步层（可选）
   页面若由 服务端/server.py 提供（http://讲台IP:8010/），自动切到"课堂服务器"模式：
   五个集合（users/acts/quiz/subs/sims）以服务器为准，本地 localStorage 只是缓存；
   DB.set 时按记录（users 按 u，其余按 id）算出 add/mod/del 差量推给服务器；
   定时轮询把别的设备的改动拉回来。双击打开 file:// 时 NET.on=false，行为与单机版完全一致。
   ============================================================ */
const NET={
  on:false,admin:false,info:null,ver:{},snap:{},applying:false,pushing:0,timer:null,queue:{},
  KEYS:['users','acts','quiz','subs','sims'],
  keyOf(k,r){return k==='users'?String(r.u||''):String(r.id||'')},
  colOf(dbk){const m={[DB.k.users]:'users',[DB.k.acts]:'acts',[DB.k.quiz]:'quiz',[DB.k.subs]:'subs',[DB.k.sims]:'sims'};return m[dbk]||null},
  dbkOf(col){return DB.k[col==='quiz'?'quiz':col]},
  headers(){const h={'content-type':'application/json'};const k=DB.get('sgzj_adm',null);if(k)h['x-admin-key']=k;return h},
  async api(path,body){
    const res=await fetch(path,body?{method:'POST',headers:this.headers(),body:JSON.stringify(body)}:{headers:this.headers()});
    const d=await res.json().catch(()=>({}));if(!res.ok)throw Object.assign(new Error(d.err||('http '+res.status)),{status:res.status,data:d});return d;
  },
  async init(){
    if(!/^https?:$/.test(location.protocol))return false;
    try{
      const qk=new URLSearchParams(location.search).get('k');
      if(qk){DB.set('sgzj_adm',qk);try{history.replaceState(null,'',location.pathname)}catch(e){}}
      const info=await this.api('/api/ping');if(!info||info.server!=='sengan')return false;
      this.on=true;this.admin=!!info.admin;this.info=info;
      await this.pull(true);
      this.timer=setInterval(()=>this.poll(),4000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.poll()});
      return true;
    }catch(e){this.on=false;return false}
  },
  /* 把服务器集合写入本地缓存（不触发推送） */
  applyCols(cols){
    this.applying=true;
    try{
      Object.entries(cols).forEach(([col,c])=>{
        this.ver[col]=c.ver;
        if(col==='ext'){DB.set(DB.k.ext,c.data||null);if(typeof applyExt==='function')applyExt(c.data||null);return}
        this.snap[col]=JSON.stringify(c.data||[]);
        DB.set(this.dbkOf(col),c.data||[]);
      });
    }finally{this.applying=false}
  },
  async pull(full){
    const d=await this.api('/api/state?v='+encodeURIComponent(JSON.stringify(full?{}:this.ver)));
    this.applyCols(d.cols||{});return Object.keys(d.cols||{});
  },
  async poll(){
    if(!this.on||this.pushing>0||document.visibilityState==='hidden')return;
    try{const changed=await this.pull(false);
      if(changed.length&&S.user&&S.user.role==='teacher'&&!$('modalBg').classList.contains('on')&&['tdash','tstudents','teval','tanalytics'].includes(S.view))go(S.view);
      if(changed.includes('subs')&&S.user&&S.user.role==='student'&&S.view==='mine')go('mine');
    }catch(e){}
  },
  /* DB.set 钩子：算差量并排队推送（同一集合串行） */
  onSet(k,v){
    if(!this.on||this.applying)return;
    if(k===DB.k.ext){this.enqueue('ext',()=>this.api('/api/ext',{ext:v}).then(d=>{this.ver.ext=d.ver}));return}
    const col=this.colOf(k);if(!col||!Array.isArray(v))return;
    const prev=JSON.parse(this.snap[col]||'[]');
    const pm={};prev.forEach(r=>{pm[this.keyOf(col,r)]=r});
    const add=[],mod=[],seen={};
    v.forEach(r=>{const key=this.keyOf(col,r);if(!key)return;seen[key]=1;
      const o=pm[key];if(!o)add.push(r);else if(JSON.stringify(o)!==JSON.stringify(r))mod.push(r)});
    const del=Object.keys(pm).filter(key=>!seen[key]);
    const body={k:col};
    if(v.length===0&&prev.length>0)body.replace=[];
    else{if(add.length)body.add=add;if(mod.length)body.mod=mod;if(del.length)body.del=del;}
    if(!body.replace&&!body.add&&!body.mod&&!body.del)return;
    this.snap[col]=JSON.stringify(v);   // 乐观更新，避免同一集合连续 set 时重复推送
    this.enqueue(col,()=>this.api('/api/sync',body).then(d=>{
      this.ver[col]=d.ver;this.snap[col]=JSON.stringify(d.data||[]);
      this.applying=true;try{DB.set(this.dbkOf(col),d.data||[])}finally{this.applying=false}
    }).catch(e=>{if(e.status===403)toast('服务器拒绝：'+e.message);}));
  },
  enqueue(col,fn){this.pushing++;const p=(this.queue[col]||Promise.resolve()).then(fn).catch(()=>{}).finally(()=>{this.pushing--});this.queue[col]=p;return p},
  studentUrl(){return this.info?(this.info.public||this.info.lan):location.origin+'/'},
};

const uid=p=>(p||'r')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  [[DB.k.acts,'a'],[DB.k.quiz,'q'],[DB.k.subs,'sub'],[DB.k.sims,'s']].forEach(([k,p])=>{

    arr.forEach(r=>{if(r&&!r.id){r.id=uid(p);ch=true}});if(ch)DB.set(k,arr);
  });
}

  if(!DB.get(DB.k.quiz)) DB.set(DB.k.quiz,[]);
  if(!DB.get(DB.k.sims)) DB.set(DB.k.sims,[]);
}
function clearLearningData(){DB.set(DB.k.acts,[]);DB.set(DB.k.quiz,[]);DB.set(DB.k.subs,[]);DB.set(DB.k.sims,[]);}
function logAct(type,detail){

}
function fmtTime(ts){const d=new Date(ts),n=Date.now(),df=n-ts;
  if(df<60000)return'刚刚';if(df<3600000)return Math.floor(df/60000)+'分钟前';
  if(df<86400000)return Math.floor(df/3600000)+'小时前';
  if(df<86400000*7)return Math.floor(df/86400000)+'天前';
  return`${d.getMonth()+1}月${d.getDate()}日`}

       '追踪方式：正向追踪（从光源，如LESS/DART-RC/DIRSIG）、反向追踪（从接收器，如FLIGHT/LIBRAT）、双向路径追踪（效率更高、精度更优）。',
       '模型类型由简到繁：半经验、解析（3D GORT）、三维辐射传输（RAPID辐射度、蒙特卡洛MCRT类）。',
       '可用于传感器与观测方案设计（飞行高度/扫描角/航线重叠、站点布设优化）与发展定量反演模型。']},
 {ch:2,sec:'机载数据获取与处理',title:'机载激光雷达数据获取与预处理',
  kw:['机载','航飞','数据获取','点云解算','安置角','检校','航带平差','辐射校正','质量控制','空域'],
  sum:'无人机机载LiDAR作业分三阶段：计划准备（项目分析、航飞方案设计、飞行准备）、航飞实施（设备安装调试、基站架设、飞行采集）、数据预处理（点云坐标解算、IMU安置角误差检校、航带平差、辐射校正、质量控制）。',
  pts:['合法飞行需实名登记、飞行执照、飞行高度与其他要求；地面基站GNSS静态观测须覆盖飞行时间。',
       '点云坐标解算依赖激光测距、扫描角、IMU姿态角、GNSS偏心分量与坐标变换矩阵。',
       'IMU安置角误差检校常用同名平面共面约束（如尖顶屋顶），显著降低距离标准差。',
       '质量控制：点云密度检查、航带接边检查、点云高程精度检查（与GPS检查点比对算中误差）。']},
 {ch:2,sec:'地基数据获取与配准',title:'地基激光雷达数据获取与点云配准',
  kw:['地基','TLS','外业','踏勘','花杆','反射片','配准','拼接','ICP','坐标系','SOCS','PRCS','GLCS'],
  sum:'地基数据外业：踏勘规划扫描线路与站点→设站找平→架设花杆/贴反射片→设参数扫描→多站拼接。内业配准把各独立扫描仪坐标系(SOCS)归一到工程坐标系(PRCS)再到全局坐标系(GLCS)。',
  pts:['站点设计原则：覆盖完整、分布均匀、移站便捷、路径不重复；近密远疏，需多站拼接。',
       '配准实质是确定不同坐标系间的转换矩阵（3个平移+3个旋转，或4×4变换矩阵）。',
       '两步配准：先手动粗拼接（找同名点对求初始转换），再用迭代最近点ICP自动精拼接。',
       '质量检查：全局拼接效果与局部细节检查，发现漏测空洞需加密或加站补测。']},
 /* —— 专题3 —— */
 {ch:3,sec:'点云滤波与分类',title:'点云去噪、滤波与分类',
  kw:['点云','去噪','滤波','分类','形态学','布料','CSF','地面点','非地面点','移动窗口','腐蚀','膨胀'],
  sum:'点云处理流程：几何配准→粗差剔除→去噪→滤波→分类。滤波是把地形（信号）与地物（建筑、树）分离、提取地面点；分类是把点云按地物类型（地面/植被/建筑/电线等）分门别类。',
  pts:['去噪：统计法（据高程/密度阈值）、频率域法、基于表面法，去除飞鸟、云等异常点。',
       '滤波算法：移动窗口滤波、数学形态学滤波（腐蚀取地面点、膨胀取地物）、布料模拟滤波CSF（重力下降的布贴合地表得DTM）。',
       '滤波与分类的区别：滤波分离地面/非地面点（为DTM服务），分类进一步按地物类型划分；滤波常是分类的前置步骤。']},
 {ch:3,sec:'DEM/DSM/CHM',title:'三维模型：DEM、DSM与CHM',
  kw:['DEM','DTM','DSM','CHM','插值','冠层高度','地形','数字表面','Kriging','IDW','反距离'],
  sum:'DTM/DEM表达裸露地表高程（地面点内插生成）；DSM表达地表最高面（首次回波/最高点插值）；CHM冠层高度模型表达植被高度，由CHM=DSM-DTM得到。',
  pts:['CHM = DSM − DTM（相同分辨率栅格相减或归一化点云栅格化）。',
       '常用插值：自然邻近NN、径向基函数RBF、克里金Kriging（地统计）、反距离权重IDW（距离越近权重越大）。',
       '应用：地形测绘、滑坡/洪灾/侵蚀监测、单木分割提取树高、辅助正射校正、森林参数提取。'],
  formula:'CHM = DSM − DTM'},
 {ch:3,sec:'全波形与光子处理',title:'全波形与光子数据处理',
  kw:['全波形','波形','高斯分解','去噪','光子计数','信号光子','噪声光子','分位数','能量','EMD'],
  sum:'全波形数据是回波能量随时间变化的连续函数；处理流程：质量控制→滤波去噪→波形分解（高斯分解）→特征参数提取。光子数据仅记录少量光子坐标，需误差纠正与粗/精去噪区分信号与噪声光子。',
  pts:['波形去噪常用均值/高斯/EMD软阈值/小波滤波；高斯分解由二阶导定拐点、LM算法迭代优化。',
       '波形分位数高度（H25/H50/H75等）与波形能量参数（冠层回波能量eCanopy、地面回波能量eGround）有生态学意义，H50可反演生物量。',
       '光子去噪：粗去噪剖面格网化+局部统计，精去噪用椭圆搜索区域+密度直方图定阈值；用EMD分解、三次样条拟合提取地面点与冠层点。']},
 /* —— 专题4 —— */
 {ch:4,sec:'林业参数调查',title:'激光雷达林业参数提取',
  kw:['单木分割','树高','冠幅','胸径','蓄积量','生物量','树种分类','LAI','ABA','ITC','反演'],
  sum:'激光雷达可提取单木参数（位置、树高、冠幅、胸径）与林分参数（LAI、郁闭度、蓄积量、生物量）。两大方法：单木分割(ITC)与林分回归(ABA，面积统计法)。',
  pts:['单木分割：基于CHM或直接基于点云，识别每棵树以提取单木尺度参数。',
       'ABA面积统计法：以格网(如400-900㎡样地)为单元计算点云高度/强度/密度统计指标，建立回归模型反演蓄积量、生物量等。',
       '蓄积量估测：机载LiDAR树高等结构参数与实测样地建立多元回归，以点推面制图。',
       '树种分类：融合高光谱光谱/纹理特征与LiDAR垂直结构特征（DSM/CHM/DEM、高度分位数），机器学习分类。']},
 {ch:4,sec:'激光雷达指数',title:'测树因子与激光雷达指数（LPI/郁闭度/间隙率/LAI）',
  kw:['测树因子','胸径','树高','LPI','激光穿透指数','郁闭度','间隙率','LAI','LAD','比尔朗伯','消光系数'],
  sum:'基本测树因子含胸径(距地1.3m处直径)、树高等。激光雷达指数刻画冠层结构：激光穿透指数LPI、郁闭度、间隙率、叶面积指数LAI与叶面积密度LAD。',
  pts:['LPI激光穿透指数=到达地面的激光点(回波)数/总点数，取值0-1，越大表示冠层越开放；郁闭度约为1−LPI。',
       '比尔-朗伯定律：I=I₀·e^(−k·LAI)，可由LPI反演LAI，即 LAI = −ln(LPI)/k，k为消光系数（常取0.5）。',
       '郁闭度=冠层垂直投影/林地面积；间隙率=能看到天空(未被遮挡)视场比例；LAD描述垂直方向单位体积叶面积。',
       'lidR是常用ALS处理R包，提供cloud/pixel/crown等多尺度metrics（.stdmetrics）。'],
  formula:'LAI = −ln(LPI)/k ；I = I₀·e^(−k·LAI)'},
 {ch:4,sec:'激光雷达发展',title:'激光雷达应用拓展与发展趋势',
  kw:['应用','发展','多光谱','高光谱','大数据','碳监测','卫星','自动驾驶','文化遗产','表型','智慧城市'],
  sum:'激光雷达与成像光谱、成像雷达并列对地观测三大前沿技术，应用于测绘、林业、农业表型、生态监测、森林保护、文化遗产（吴哥窟林下考古）、自动驾驶等。发展方向：高性能、低成本、小型化。',
  pts:['多/高光谱LiDAR兼具空间三维与光谱信息，是高精度反演植被结构+生化参数的最佳手段之一。',
       '多平台多模态点云催生点云大数据，需海量点云智能处理（弱监督/机理知识迁移）。',
       'LiDAR卫星（GEDI、ICESat-2、高分七号、陆地生态系统碳监测卫星）推动全球地表产品向高精度高分辨率发展。',
       '推动自然资源监测从二维向三维转变，助力智慧城市（LiDAR+5G+IoT+AI）与自动驾驶。']},
 /* —— 专题5 —— */
 {ch:5,sec:'生态因子作用',title:'森林环境与生态因子作用规律',
  kw:['森林','环境','生态因子','生存条件','生境','综合作用','主导因子','限制因子','阶段性','补偿'],
  sum:'森林是以木本植物为主体的生物群落复合体。生态因子是环境中对生物有直接或间接影响的要素。其作用规律有综合作用、主导因子作用、直接与间接作用、阶段性作用、不可替代性和补偿作用。',
  pts:['综合作用：生态因子彼此联系、互相促进制约（如水温升高溶氧下降）。',
       '主导因子作用：干旱区水分、高纬/高山温度常为主导（限制）因子。',
       '直接/间接作用：地形（坡度坡向海拔）间接通过改变光温水影响生物。',
       '阶段性作用（如低温对冬小麦春化必需但后期有害）；不可替代性与补偿作用（光照不足可由CO₂浓度部分补偿）。']},
 {ch:5,sec:'光温水因子',title:'光、温度、水因子的生态作用',
  kw:['光','光照强度','光补偿点','光饱和点','耐荫性','温度','积温','水分','干燥度','LAI','黄化'],
  sum:'光含光照强度、光质、光照长度。温度随纬度、海拔、坡向变化。水分状况用干燥度衡量并决定自然植被类型。',
  pts:['光补偿点：光合固定CO₂与呼吸消耗相等时的光强；光饱和点：再增光强净光合不再增加时的光强。阳性植物两点均高，阴性植物均低。',
       '林内光照 I=I₀·e^(−k·LAI)，LAI为叶面积指数、k为削光系数；黄化是缺光形态（节间长、叶黄薄）。',
       '温度随纬度增1度约降0.5℃、海拔升高约0.5-0.6℃/100m；极端低温致寒害/霜害/冻害/冻拔/生理干旱。',
       '干燥度K=0.16×活动积温(≥10℃)/降水量：K≤0.99森林，1-1.49森林草原，1.5-3.99草甸/草原/荒漠草原，≥4荒漠。'],
  formula:'干燥度 K = 0.16·Σt(≥10℃) / P'},
 {ch:5,sec:'风土火因子',title:'风、土壤与火因子',
  kw:['风','风倒','旗形','土壤','质地','团粒','pH','有机质','火','林火','可燃物','地表火','林冠火'],
  sum:'风既传粉传种也具破坏力（超10m/s致风倒风折、旗形树冠）。土壤质地分砂/壤/粘土，团粒结构最利林木；pH影响养分有效性。火是重要生态因子，林火三要素为可燃物、助燃物(氧)、火源。',
  pts:['土壤pH：小于6固氮菌活性降低、大于8硝化受限；针叶树3.7-4.5、阔叶树5.5-6.9适宜。团粒结构最好。',
       '林火类型：地表火（烧死地被物，最常见）、林冠火（在树冠层燃烧扩展）、地下火（腐殖质/泥炭层燃烧、见烟少见火焰）。',
       '林火三要素：可燃物、助燃物（氧）、火源，还需合适气候气象条件；火烧改变土壤pH（升高）、养分与群落演替。',
       '植物对火适应：抗火厚树皮（兴安落叶松可达20cm）、保护芽、无性繁殖、迟开球果遇热开裂散种。']},
 /* —— 专题6 —— */
 {ch:6,sec:'智慧林业',title:'信息革命与智慧林业',
  kw:['信息革命','智慧林业','数字林业','3S','云物移大智','立体感知','生态文明','两山'],
  sum:'人类经历农业、工业、信息三次技术革命，正进入以“云、物、移、大、智”为核心的第六次信息革命。智慧林业是数字林业之上、融合新一代信息技术、构建立体感知—管理协同—服务高效的林业现代化新模式。',
  pts:['数字林业（基础阶段）：数字化/网络化/可视化，核心技术3S（RS遥感、GNSS、GIS）+计算机互联网。',
       '智慧林业（升级阶段）：感知化/物联化/智能化，核心技术物联网、大数据、云计算、AI、移动互联网。',
       '目标：立体感知、精准培育、实时监测、智慧管理和智能决策；服务生态文明与“两山”理念。']},
 {ch:6,sec:'森林环境感知概述',title:'林业智能感知与空间信息技术',
  kw:['智能感知','智能传感器','信息网络','RFID','GIS','RS','GNSS','北斗','空间信息','防火','病虫害'],
  sum:'林业智能感知系统由编码系统、智能传感器和信息网络系统构成，关键是智能传感器和信息网络系统。林业空间信息技术利用RS、GNSS、GIS、物联网传感器获取处理森林空间信息。',
  pts:['智能传感器采集林木及环境信息（依赖RFID、各类传感器、红外感应），应用于防火、病虫害防治、动植物保护、生态因子监测。',
       '信息网络系统通过无线传感器网络节点+4G/5G把数据传回数据中心。',
       'RS（高分、句芒号碳卫星+无人机/激光雷达）、GNSS（北斗亚米级）、GIS（全空间+AI时空大数据挖掘）。']},
 {ch:6,sec:'感知核心技术',title:'大数据采集与云计算/物联网/AI',
  kw:['大数据','数据采集','ETL','云计算','物联网','IoT','人工智能','AI','深度学习','传感器','遥感','6G'],
  sum:'大数据采集方法含系统日志、网络爬虫、数据库、感知设备（传感器/摄像头/GPS/RFID）采集，步骤为确定范围→选技术→ETL处理→质量保障→存储。核心分析技术：云计算、物联网、人工智能。',
  pts:['大数据采集要点：全面性、多维性、高效性、数据质量、安全与隐私。',
       '遥感感知方式：可见光（直观但受云雨昼夜限制）、热红外（测地表温度、全天时、火情预警）、微波（全天候穿透云雨、InSAR形变）、激光雷达（主动、三维、穿透冠层）。',
       '云计算分布式处理海量数据；物联网(IoT)按协议连接万物实现智能识别/定位/跟踪/监管，6G推动“万物智联”。',
       '人工智能模拟人类智能（感知/推理/决策/学习），2010s深度学习革命（AlexNet）带来爆发式增长。']},
 /* —— 专题7 —— */
 {ch:7,sec:'物联网概念与模型',title:'物联网概念、特征与四层模型',
  kw:['物联网','IoT','3C','全面感知','可靠传递','智能处理','感知层','网络层','应用层','四层'],
  sum:'物联网是通过RFID、传感器、红外、GPS、激光扫描器等按约定协议把物品与互联网连接、进行信息交换以实现智能识别/定位/跟踪/监控/管理的网络，是检测与控制、传输与通信、计算融合的3C新技术。',
  pts:['技术特征：全面感知（核心）、可靠传递、智能处理。',
       '应用视角三层：感知层、网络层、应用层；技术视角四层：感知层、传输层、处理层、应用层。',
       '感知层位于最底端，是所有上层的基础，负责采集物理世界的事件与数据。']},
 {ch:7,sec:'感知层与传感器',title:'感知层技术与传感器特性分类',
  kw:['感知层','传感与检测','敏感元件','转换元件','RFID','条形码','二维码','定位','智能传感器','分类'],
  sum:'感知层三大功能：传感与检测（它怎么样）、识别与标识（它是谁，RFID/条码）、定位（它在哪里，GPS/北斗）。传感器由敏感元件、转换元件和变换电路组成（GB7665-2005）。',
  pts:['RFID射频识别由阅读器、天线、标签组成，无接触识别；相比条码体积小、抗污、可重复读写、穿透性强、数据安全。',
       '现代传感器：微型传感器(MEMS)、智能传感器（敏感元件+信号调理+MPU+接口集成一芯）、数字传感器、网络传感器(WSN)。',
       '传感器分类：按被测量、按工作原理（物性型/结构型/化学型/生物型）、按信号变换（能量转换型无源/能量控制型有源）。']},
 {ch:7,sec:'无线传感器网络',title:'WSN组成、特点与路由协议',
  kw:['WSN','无线传感器网络','传感器节点','Sink','自组织','多跳','LoRa','ZigBee','路由','Flooding','SPIN','LEACH','GPSR'],
  sum:'无线传感器网络(WSN)是大量传感器以自组织、多跳方式构成的无线网络，三要素为感知对象、传感器、观察者。节点由传感、处理、收发、电源单元组成，能量/处理能力受限、以数据为中心。',
  sumx:'',
  pts:['通信技术：近距离(ZigBee/蓝牙/WiFi/UWB)、广域(GPRS/4G/LoRa)；LoRa超远距离(空旷10km+)、高灵敏度、低功耗，运行于433/868/915MHz免授权频段。',
       'LoRaWAN终端分Class A(最省电)/B(定时接收)/C(持续接收能耗大)。',
       '典型路由协议：Flooding洪泛（简单但信息爆炸/重叠）、SPIN（协商机制解决内爆/重叠）、DD定向扩散（梯度、以数据为中心）、GPSR（基于位置贪心+右手法则）、LEACH（分簇、类头节点数据融合）。',
       '林业应用：声波层析成像给树做CT、TreeTalker树木智能感知（液流/生长/稳定性/健康，LoRa回传）、LoRaWAN森林火灾早期预警(CO₂+温湿压多传感器)。']},
 /* —— 专题8（林业气象传感器，13节）—— */
 {ch:8,sec:'气象要素概述',title:'林业气象要素与传感器概述',
  kw:['气象要素','概述','影响','温度','湿度','光照','降水','风','观测站','基本'],
  sum:'林业作业多在开阔自然环境下进行，受温度、湿度、光照、降水、风速和风向等气象要素影响。传感器把这些非电量变化转换为可测的电信号，供监测系统采集处理。',
  pts:['五大要素：温度、湿度、光照、降水、风速/风向，均显著影响林木生长与林业安全。',
       '温度影响光合、呼吸与生长速率；湿度关系水分蒸腾，过高易致病害、过低易致干旱与火险。',
       '光照是光合作用唯一能源，含光照强度、日照长度、光谱成分。',
       '风的有利影响：传粉传播种子；不利影响：助长林火、加重干旱、造成风倒风折。',
       '野外多将多种传感器集中布设为“观测站”，经有线/无线把数据传回上位机。']},
 {ch:8,sec:'温度传感器',title:'温度传感器：原理与分类',
  kw:['温度','热电阻','热电偶','NTC','PT100','Cu50','半导体','接触','非接触','热敏','红外测温','塞贝克'],
  sum:'温度传感器把温度变化转换为电阻、电压或电流的变化。按测温方式分接触式与非接触式；接触式常见热电阻、热电偶、半导体三类。',
  pts:['接触式：敏感元件与被测对象直接接触达到热平衡，直观可靠、价格低；但会扰动被测温场，不适合腐蚀/超高温。',
       '非接触式：通过热辐射测温，不干扰对象、响应快、可测运动体与高温，量程可达上千℃。',
       '热电阻：利用金属/半导体电阻随温度变化。铂电阻PT100精度高、稳定，作国际温标基准；铜电阻Cu50线性好、成本低但易氧化(约-40~120℃)。',
       '半导体热敏电阻(NTC)：灵敏度高、体积小、响应快；但阻值-温度呈非线性、一致性与长期稳定性较差，需按Steinhart-Hart方程反推。',
       '热电偶：基于塞贝克(热电)效应，两种导体接点温差产生热电动势；测温范围宽(-200~1800℃)、灵敏度高、响应快，适合高温与快速变化测量。'],
  formula:'NTC Steinhart-Hart：1/T = A + B·lnR + C·(lnR)³'},
 {ch:8,sec:'湿度传感器',title:'湿度传感器：电阻式与电容式',
  kw:['湿度','湿敏','电阻式','电容式','SHT','相对湿度','RH','介电常数','温漂','时漂'],
  sum:'湿度表示空气潮湿程度，相对湿度范围0~100%RH。湿度传感器借助感湿材料把湿度转换为电阻或电容的变化。',
  pts:['电阻式：基片覆盖感湿薄膜，吸附水蒸气后电阻值变化，据此测相对湿度。',
       '电容式：感湿材料介电常数随湿度变化引起电容变化，电容变化量与相对湿度成正比。',
       '精度约2%~3%RH，结构简单、响应较快；但抗污染能力与稳定性有限。',
       '存在时间漂移(时漂)与温度漂移(温漂)，高温高湿或低温高湿环境需温度补偿。',
       'SHT11为常用集成数字温湿度传感器：湿度0~100%RH、温度-40~100℃，可直接输出数字信号。']},
 {ch:8,sec:'光照传感器',title:'光照传感器：光电效应四类器件',
  kw:['光照','光敏电阻','光电二极管','光电三极管','光电池','光伏效应','照度','lux','PN结','光电效应'],
  sum:'光照强度指单位面积接收的可见光通量，单位勒克斯(Lux)。光照传感器以光电效应把光信号转换为电信号。',
  pts:['光敏电阻(光导管)：阻值随光强变化的半导体元件，光越强→电阻越小；无极性、电路简单、成本低。',
       '光电二极管：内含PN结，反向偏压下工作；光强越大反向电流越大，响应快。',
       '光电三极管：兼具光敏与放大作用，灵敏度高，输出电流受光强调制。',
       '光电池：光伏效应下直接把光能转为电能(硅光电池)，无需外加电源，输出与光强相关。',
       '林业应用：判断林分郁闭度、光合有效辐射，指导抚育间伐与生长监测。']},
 {ch:8,sec:'雨量传感器',title:'雨量传感器：四种测量原理',
  kw:['雨量','降水','翻斗','虹吸','称重','光学','翻斗式','降水量','脉冲','干簧'],
  sum:'降水量传感器测量液体降水量、降水强度与起止时间。常见有虹吸式、称重式、翻斗式、光学式。',
  pts:['虹吸式：雨水入盛水器→浮子随水位上升带动记录笔；达虹吸管顶发生虹吸迅速排水，可记录降雨过程。',
       '称重式：连续称量储水器降水质量并换算降水量，精度高，适合雪、冰雹等固态降水。',
       '翻斗式(最常用)：由承水器、上翻斗、计量翻斗、计数翻斗、干簧开关与信号记录器组成；每翻转一次触发一个脉冲，累计脉冲即降雨量(如0.01mm/斗)。',
       '光学式：雨滴接触导光器致光路散射衰减，接收端检测光能变化算降水量。',
       '核心思想：把降水的物理量(体积/质量/光变化)转换为可计数或可记录的电信号。']},
 {ch:8,sec:'风速传感器',title:'风速传感器：风杯、螺旋桨、热线',
  kw:['风速','风杯','螺旋桨','热线','脉冲','风速计','抛物锥'],
  sum:'风速计测量空气流动速度。气象观测最常用风杯风速计。',
  pts:['风杯式：3个抛物锥形空杯间隔120°装于垂直转轴，风吹旋转，转速与风速成正比；每转输出一定脉冲数(如18个)，计数换算得风速。',
       '螺旋桨式：桨叶带动风速码盘，经光电扫描产生脉冲，按脉冲频率算风速；惯性小、灵敏度高，适合低风速。',
       '热线式：加热金属细丝置于气流中，散热速率与风速平方根呈线性；灵敏度高，可测微风，常用于气流研究。']},
 {ch:8,sec:'风向传感器',title:'风向传感器：电磁/光电/电阻式',
  kw:['风向','风向标','格雷码','电磁','光电','电阻','陀螺仪','电子罗盘'],
  sum:'风向传感器通过风向标转动感知风向并转换为电信号：风吹尾翼、箭头指向来风方向、内部机构把机械转动转为电信号。',
  pts:['电磁式：利用电磁原理，部分采用陀螺仪芯片或电子罗盘作基本元件，精度更高。',
       '光电式：采用绝对式格雷码盘作基本元件，通过光电转换准确输出风向。',
       '电阻式：结构类似滑动变阻器，最大/最小电阻标为360°与0°，随风向标转动产生电压变化算出风向角度。']},
 {ch:8,sec:'土壤水分传感器',title:'土壤水分传感器',
  kw:['土壤水分','含水率','TDR','FDR','电容式','电阻式','时域反射','频域'],
  sum:'土壤含水量(含水率)直接影响地表与空气水分状况。常用称重法、张力计法、电阻法、中子法、γ射线法、时域反射法(TDR)、高频振荡法(FDR)等。',
  pts:['典型系统：温湿度传感器采集→A/D转换→单片机处理→液晶显示，可设阈值实现水分异常报警。',
       '时域反射法(TDR)利用电磁波在土壤中传播特性测含水率；高频振荡法(FDR)属频域方法。',
       '智慧林业需要能实时监测并支持远距离传输的土壤传感器。']},
 {ch:8,sec:'土壤养分传感器',title:'土壤养分传感器：近红外光谱',
  kw:['土壤养分','近红外','NIR','氮磷钾','有机质','光谱','精准农林业'],
  sum:'精准农林业结合信息技术、农林技术与生物技术。研究热点集中于近红外光谱技术(NIR)，主要检测有机质、氮、磷、钾。',
  pts:['工作过程：光源(可见光+近红外)照射土壤→漫反射光经光纤入光谱模块→采集光谱送微处理器→用养分光谱预测算法算养分含量→显示并经GPS定位、通信模块传至PC端。',
       '价值：按土壤条件调节投入，实现少投入、高效率、高产出。']},
 {ch:8,sec:'土壤酸碱度传感器',title:'土壤酸碱度(pH)传感器',
  kw:['pH','酸碱度','电位法','玻璃电极','氢离子','活度','复合电极'],
  sum:'土壤pH是酸碱度强度指标，影响养分存在状态与有效性。常见测量法：电位法(应用最广)、多光谱图像检测法、混合指示剂比色法。',
  pts:['电位法：复合电极在溶液中形成化学电池，检测电极电位差计算pH，精度高、应用最广。',
       'pH定义：并非直接测氢离子浓度，而是氢离子活度的负对数 pH=-lg[H⁺]；如[H⁺]=10⁻⁷mol/L则pH=7为中性。',
       '常见类型：玻璃电极pH传感器(最广)、酶pH传感器、光化学pH传感器。']},
 {ch:8,sec:'胸径监测传感器',title:'胸径(DBH)监测传感器',
  kw:['胸径','DBH','容栅','磁栅','光栅','位移','相位跟踪','材积'],
  sum:'胸径指距地面1.3m处树干直径，用于了解活立木生长状况、估算材积。传统人工卡尺/围尺误差大、费时、难连续监测。',
  pts:['结构：数显组件(显示器、单片机、位移传感器)+尺胚(含尺爪)。尺爪接触树干产生位移→转换电路转数字→单片机计算→显示胸径。',
       '常见位移传感器：容栅式、磁栅式、光栅式，均通过测位移变化算胸径。',
       '容栅式优势：体积小、成本低、安装方便、分辨率高；据相位跟踪原理测位移。']},
 {ch:8,sec:'树高监测传感器',title:'树高监测传感器：三角测量',
  kw:['树高','倾角','三角','经纬仪','全站仪','激光测距','倾角传感器','编码器'],
  sum:'树高是评价树木生长状况与林分结构的重要指标。常见测量法：经纬仪、全站仪、激光测距仪、机械式仪器。',
  pts:['机械式操作复杂、精度低；经纬仪/全站仪精度高但需专业操作且体积大；激光式便携精度高但昂贵。',
       '结构：倾角传感器+光电编码器+单片机(AT89S51)+LCD+键盘。',
       '原理(三角关系)：在A点观测，A点离地高h、观测树根视线与水平夹角α、水平距离D，则树高 = D·tanα + h。'],
  formula:'树高 = D·tanα + h'},
 {ch:8,sec:'叶绿素监测传感器',title:'叶绿素监测传感器',
  kw:['叶绿素','SPAD','RGB','颜色传感器','光谱','色素','光合'],
  sum:'叶绿素含量是判断植物生长状况的重要标志。便携式SPAD-502等昂贵、功能单一；传统分光光度法依赖人工、误差大。',
  pts:['系统框架：光源→被测叶片→频率采集/光强接收→信号处理→单片机→存储→显示。',
       '叶绿体色素分三类：叶绿素类、类胡萝卜素类、藻胆素类；不同色素吸收不同波长光。',
       '测量法：用RGB颜色传感器测叶片→输出模拟电压→据电压变化获取亮度与颜色信息，推算叶绿素含量。']},
 /* —— 补充：机载扫描方式 / 点云平台对比 / 陆碳卫星 / 传感器分类 —— */
 {ch:1,sec:'激光雷达平台分类',title:'机载扫描方式对比与点云差异',
  kw:['扫描方式','摆镜','旋转棱镜','椭圆','光纤','点云分布','穿透','机载点云','地基点云','对比'],
  sum:'机载激光雷达有摆镜、旋转棱镜、椭圆、光纤四种扫描方式，点云分布特征与林冠穿透能力各异；机载与地基点云在尺度、密度、树干/树冠信息上互补。',
  pts:['摆镜(锯齿形)：中间密边缘稀、穿透一般，适合基础森林资源调查；旋转棱镜(平行线)：较均匀、适合大范围清查。',
       '椭圆扫描：多角度、穿透强，适合生物量估算与林分结构分析；光纤扫描：规则可控、体积小，适合无人机精细调查。',
       '机载点云：区域尺度、密度中等、树冠信息强、树干弱(被遮挡)，用于资源调查；',
       '地基点云：样地/单木尺度、密度极高、树干信息强、树冠较弱(视角限制)，用于精细结构分析。']},
 {ch:4,sec:'激光雷达发展',title:'陆地生态系统碳监测卫星（句芒号 CM-1）',
  kw:['陆碳','碳监测卫星','句芒号','CM-1','主被动','植被激光雷达','荧光','SIF','火点','北斗','塞罕坝','碳储量'],
  sum:'陆地生态系统碳监测卫星(CM-1，2022年发射)是国家林草局牵头主用户的首颗卫星，也是世界首颗采用主被动联合对森林观测的遥感卫星，服务林分高度、生物量、碳储量等监测。',
  pts:['轨道高度约506km；载荷含植被激光雷达(5波束、1064nm、地面光斑约25m)、多角度多光谱相机(5角度)、超光谱成像仪、大气激光雷达、火点检测敏感器。',
       '植被激光雷达发射激光光斑与森林作用形成波形，分析波形获取树高，进而反演蓄积量、生物量与碳储量。',
       '超光谱成像仪探测太阳诱导叶绿素荧光(SIF，650-800nm)，与光合固碳同源，直接指示总初级生产力GPP与植被胁迫。',
       '火点检测敏感器星上识别火点，经北斗短报文将火点位置/面积传回，报警时延≤60s。',
       '塞罕坝等开展“天空地”一体化实验(卫星+机载激光雷达+地面样地)，树高反演R²可达0.9以上。']},
 {ch:7,sec:'感知层与传感器',title:'传感器分类（能量转换型/控制型等）',
  kw:['传感器分类','物性型','结构型','化学型','生物型','能量转换型','能量控制型','有源','无源','热电偶','霍尔','压电'],
  sum:'传感器分类方法多样：按被测量、按工作原理(物性型/结构型/化学型/生物型)、按信号变换特征(能量转换型/能量控制型)。',
  pts:['物性型：利用材料内在特性效应直接转换(如压电晶体)；结构型：以结构形状尺寸为基础(如电容式)。',
       '化学型：利用化学反应(气体传感器)；生物型：对生物物质敏感(酶传感器)。',
       '能量转换型(无源)：被测对象输入能量使其工作，如热电偶(塞贝克)、霍尔、光电池、压电传感器。',
       '能量控制型(有源)：需外部激励源，如电阻应变、热敏电阻、电容式、电感式、涡流传感器。']},
];

const QUIZ=[

 {ch:1,type:'single',sec:'遥感与激光雷达导入',q:'下列属于主动式遥感的是？',

/* ============================================================
   仿真案例 SIMCASES（每个专题 ≥1 个参数化计算/仿真案例）
   inputs:[{k,label,val,min,max,step,unit}]；compute(v)返回[{label,val,unit,tone}]
   ============================================================ */
const SIMCASES=[
 {ch:1,id:'tof',name:'激光雷达测距（飞行时间法）',
  desc:'调节回波飞行时间与大气折射率，实时计算激光雷达到目标的距离，理解 ToF 测距原理。',
  formula:'P = c·t / (2n) ，c = 3×10⁸ m/s',
  inputs:[{k:'t',label:'往返飞行时间',val:800,min:100,max:2000,step:10,unit:'ns'},
          {k:'n',label:'大气折射率 n',val:1,min:1,max:1.05,step:0.001,unit:''}],
  compute:v=>{const c=3e8;const P=c*(v.t*1e-9)/(2*v.n);
    return [{label:'目标距离 P',val:P.toFixed(2),unit:'m'},
            {label:'单程距离',val:(P).toFixed(2),unit:'m',tone:'blue'},
            {label:'折射率修正影响',val:((1/v.n-1)*100).toFixed(2),unit:'%',tone:'amber'}]},
  note:'折射率n随气压、温度、湿度变化；n增大将使解算距离偏小，需大气改正。'},
 {ch:1,id:'footprint',name:'星载激光雷达地面光斑',
  desc:'轨道高度与激光发散角决定地面光斑大小；光斑越大，地物混合与测距误差越大。',
  formula:'D = Z·θ （Z 轨道高度，θ 发散角）',
  inputs:[{k:'Z',label:'轨道高度 Z',val:500,min:300,max:800,step:10,unit:'km'},
          {k:'th',label:'激光发散角 θ',val:0.05,min:0.01,max:0.5,step:0.01,unit:'mrad'}],
  compute:v=>{const D=v.Z*v.th; // km×mrad = m
    return [{label:'地面光斑直径 D',val:D.toFixed(1),unit:'m',tone:D>50?'red':D>25?'amber':''},
            {label:'光斑面积(近似)',val:(Math.PI*Math.pow(D/2,2)).toFixed(0),unit:'m²',tone:'blue'}]},
  note:'GEDI光斑约25m、ICESat约70m；减小发散角(望远镜扩束)可提高测距精度。'},
 {ch:2,id:'flight',name:'机载激光雷达航飞参数',
  desc:'飞行高度、视场角、速度与脉冲频率共同决定扫描带宽与点云密度——航飞方案设计的核心权衡。',
  formula:'SW = 2H·tan(FOV/2) ；点密度 ≈ PRF /(SW·V)',
  inputs:[{k:'H',label:'飞行高度 H',val:300,min:50,max:1500,step:10,unit:'m'},
          {k:'fov',label:'视场角 FOV',val:60,min:20,max:80,step:1,unit:'°'},
          {k:'V',label:'飞行速度 V',val:6,min:3,max:15,step:0.5,unit:'m/s'},
          {k:'prf',label:'脉冲频率 PRF',val:500,min:100,max:2000,step:10,unit:'kHz'}],
  compute:v=>{const SW=2*v.H*Math.tan(v.fov/2*Math.PI/180);
    const dens=(v.prf*1000)/(SW*v.V);
    return [{label:'扫描带宽 SW',val:SW.toFixed(1),unit:'m'},
            {label:'点云密度(近似)',val:dens.toFixed(1),unit:'点/m²',tone:dens<4?'amber':''},
            {label:'单航线覆盖',val:(SW*v.V).toFixed(0),unit:'m²/s',tone:'blue'}]},
  note:'高度越高覆盖越大但点密度越低、精度下降；点密度是数据质量与后续处理方法选择的重要指标。'},
 {ch:3,id:'chm',name:'冠层高度模型 CHM 生成',
  desc:'CHM 由数字表面模型减去数字地面模型得到，是提取树高的基础产品。',
  formula:'CHM = DSM − DTM',
  inputs:[{k:'dsm',label:'DSM 表面高程',val:22.5,min:0,max:40,step:0.1,unit:'m'},
          {k:'dtm',label:'DTM 地面高程',val:3.5,min:0,max:40,step:0.1,unit:'m'}],
  compute:v=>{const chm=Math.max(0,v.dsm-v.dtm);
    return [{label:'冠层高度 CHM',val:chm.toFixed(1),unit:'m',tone:chm<=0?'red':''},
            {label:'相对树高等级',val:chm>25?'高':chm>10?'中':'低',unit:'',tone:'blue'}]},
  note:'需同分辨率栅格相减；CHM小于0多为插值或滤波误差，应检查地面点分类。'},
 {ch:4,id:'lai',name:'叶面积指数 LAI 反演（比尔-朗伯）',
  desc:'由激光穿透指数 LPI 与消光系数 k，基于比尔-朗伯定律反演叶面积指数与郁闭度。',
  formula:'LAI = −ln(LPI)/k ；郁闭度 ≈ (1−LPI)×100%',
  inputs:[{k:'lpi',label:'激光穿透指数 LPI',val:0.3,min:0.01,max:0.99,step:0.01,unit:''},
          {k:'k',label:'消光系数 k',val:0.5,min:0.3,max:0.7,step:0.01,unit:''}],
  compute:v=>{const lai=-Math.log(v.lpi)/v.k;const cc=(1-v.lpi)*100;
    return [{label:'叶面积指数 LAI',val:lai.toFixed(2),unit:'',tone:lai>4?'':'amber'},
            {label:'郁闭度',val:cc.toFixed(0),unit:'%',tone:'blue'}]},
  note:'k常取0.5(Pierce & Running,1988)，但实际随太阳角、叶倾角与林分结构动态变化。'},
 {ch:5,id:'aridity',name:'干燥度与自然植被分区',
  desc:'由活动积温与年降水量计算干燥度 K，判断对应的自然植被类型——水分决定植被地带。',
  formula:'K = 0.16 · Σt(≥10℃) / P',
  inputs:[{k:'st',label:'活动积温 Σt(≥10℃)',val:4000,min:1000,max:8000,step:50,unit:'℃'},
          {k:'p',label:'年降水量 P',val:800,min:100,max:2000,step:10,unit:'mm'}],
  compute:v=>{const E=0.16*v.st;const K=E/v.p;
    let veg,tone;if(K<=0.99){veg='森林';tone='';}else if(K<1.5){veg='森林草原';tone='blue';}
    else if(K<4){veg='草甸/草原/荒漠草原';tone='amber';}else{veg='荒漠';tone='red';}
    return [{label:'可能蒸发量 E',val:E.toFixed(0),unit:'mm',tone:'blue'},
            {label:'干燥度 K',val:K.toFixed(2),unit:''},
            {label:'自然植被类型',val:veg,unit:'',tone}]},
  note:'K≤0.99森林、1-1.49森林草原、1.5-3.99草甸/草原/荒漠草原、≥4荒漠。'},
 {ch:6,id:'bigdata',name:'传感网大数据量估算',
  desc:'节点数、采样间隔与时长决定数据规模，理解大数据采集与存储的压力。',
  formula:'记录数 = 节点数 × (86400/采样间隔) × 天数',
  inputs:[{k:'nodes',label:'传感器节点数',val:50,min:1,max:500,step:1,unit:'个'},
          {k:'itv',label:'采样间隔',val:60,min:1,max:3600,step:1,unit:'秒'},
          {k:'bytes',label:'每样本字节',val:64,min:10,max:500,step:2,unit:'B'},
          {k:'days',label:'累计时长',val:30,min:1,max:365,step:1,unit:'天'}],
  compute:v=>{const perDay=v.nodes*(86400/v.itv);const total=perDay*v.days;
    const mb=total*v.bytes/1e6;
    return [{label:'日均记录数',val:Math.round(perDay).toLocaleString(),unit:'条',tone:'blue'},
            {label:'累计记录数',val:Math.round(total).toLocaleString(),unit:'条'},
            {label:'累计数据量',val:mb.toFixed(1),unit:'MB',tone:mb>1000?'amber':''}]},
  note:'数据量随节点与采样率快速膨胀，需在预警灵敏度与存储/传输/功耗间权衡。'},
 {ch:7,id:'battery',name:'传感器节点续航估算',
  desc:'电池容量与平均电流决定低功耗广域网节点的续航——LoRaWAN 节点数年免维护的关键。',
  formula:'续航 = 电池容量(µAh) / 平均电流(µA)',
  inputs:[{k:'cap',label:'电池容量',val:19000,min:1000,max:20000,step:100,unit:'mAh'},
          {k:'avg',label:'平均电流',val:150,min:10,max:2000,step:10,unit:'µA'}],
  compute:v=>{const hours=v.cap*1000/v.avg;const days=hours/24;const years=days/365;
    return [{label:'理论续航',val:Math.round(days).toLocaleString(),unit:'天'},
            {label:'约合',val:years.toFixed(1),unit:'年',tone:years>=2?'':'amber'}]},
  note:'如 Milesight EM500-CO2 采用19000mAh电池支持数年免维护；实际受温度、上报频率影响。'},
 {ch:8,id:'raintip',name:'翻斗式雨量计降雨量',
  desc:'翻斗每翻转一次触发一个脉冲，累计脉冲乘以每斗雨量即得降雨量，并判定降雨等级。',
  formula:'降雨量 = 脉冲数 × 每斗雨量',
  inputs:[{k:'pulse',label:'翻斗脉冲数',val:120,min:0,max:2000,step:1,unit:'次'},
          {k:'tip',label:'每斗降雨量',val:0.1,min:0.01,max:1,step:0.01,unit:'mm'}],
  compute:v=>{const r=v.pulse*v.tip;
    let lvl,tone;if(r<10){lvl='小雨';tone='';}else if(r<25){lvl='中雨';tone='blue';}
    else if(r<50){lvl='大雨';tone='amber';}else if(r<100){lvl='暴雨';tone='amber';}else{lvl='大暴雨';tone='red';}
    return [{label:'累计降雨量',val:r.toFixed(2),unit:'mm'},
            {label:'降雨等级(24h参考)',val:lvl,unit:'',tone}]},
  note:'强降雨时翻斗翻转间隙可能漏水导致低估，可用称重式或提高翻斗分辨率改进。'},
];

function cctx(id,dh){const cv=$(id);if(!cv)return null;const ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return null;
  const dpr=devicePixelRatio||1,W=cv.offsetWidth||700,H=cv.offsetHeight||dh||300;

/* 多模态交互：语音提问（Web Speech API）与朗读回答（SpeechSynthesis），不支持的浏览器给出提示而不报错 */
function voiceAsk(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前浏览器不支持语音识别，请使用 Chrome/Edge 或改用文字提问');return}
  try{const r=new SR();r.lang='zh-CN';r.interimResults=false;const mic=$('chatMic');mic.textContent='🔴';
    r.onresult=e=>{const t=e.results[0][0].transcript;$('chatText').value=t;mic.textContent='🎤';sendChat()};
    r.onerror=()=>{mic.textContent='🎤';toast('未识别到语音，请再试一次')};r.onend=()=>{mic.textContent='🎤'};r.start();
  }catch(e){toast('语音识别启动失败');}
}
function speakText(t){
  if(!window.speechSynthesis){toast('当前浏览器不支持语音朗读');return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).slice(0,600));u.lang='zh-CN';u.rate=1;speechSynthesis.speak(u);}catch(e){}
}
function botSay(html,src){chatHistory.push({who:'bot',html,src});renderMsg('bot',html,src)}
function userSay(txt){chatHistory.push({who:'user',html:escapeHtml(txt)});renderMsg('user',escapeHtml(txt))}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function sendChat(){
  const t=$('chatText');const q=t.value.trim();if(!q)return;t.value='';
  userSay(q);logAct('chat','询问“'+q.slice(0,20)+'”');
  const body=$('chatBody');
  const typing=el('div','msg bot');typing.innerHTML='<div class="av">🌲</div><div class="bubble typing"><span></span><span></span><span></span></div>';
  body.appendChild(typing);body.scrollTop=body.scrollHeight;
  const ai=DB.get(DB.k.ai,null);
  let answer=null,usedModel=false;
  if(ai&&ai.key){try{answer=await callModel(q,ai);usedModel=true}catch(e){answer=null}}
  typing.remove();
  if(usedModel&&answer){botSay(escapeHtml(answer).replace(/\n/g,'<br>'),'AI大模型 · '+(ai.model||'大模型'))}
  else{const r=localAnswer(q);botSay(r.html,r.src+(ai&&ai.key?'（大模型不可达，已回退本地知识库）':''))}
}
function localAnswer(q){
  const ql=q.toLowerCase();
  let best=null,bs=0;
  KB.forEach(k=>{
    let s=0;
    k.kw.forEach(w=>{if(ql.includes(w.toLowerCase()))s+=3});
    if(q.includes(k.sec))s+=4;
    (k.sec+k.title).split('').forEach(ch=>{if(q.includes(ch)&&/[一-龥A-Za-z]/.test(ch))s+=0.05});
    if(s>bs){bs=s;best=k}
  });
  if(!best||bs<1){
    return{html:`我暂时没有精确匹配到你的问题。你可以换个说法，或按专题浏览这些主题：<br>${CH.map(c=>`<span style="color:var(--accent)">·${chShort(c.id)}</span>`).join('　')}<br><br>💡 提示：接入大模型后（点右上角🧠），我可以回答课程之外的开放问题。`,src:'课程知识库'};
  }
  let html=`<h4>${best.title}</h4>${best.sum}<ul>${best.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  if(best.formula)html+=`<div style="font-family:var(--mono);background:var(--bg-2);padding:8px 12px;border-radius:8px;margin-top:6px;font-size:.82rem">${best.formula}</div>`;
  return{html,src:chTitle(best.ch)+' · '+best.sec};
}
async function callModel(q,ai){
  const ctx=KB.map(k=>`【${chShort(k.ch)}·${k.sec}】${k.sum} ${k.pts.join(' ')}`).join('\n');
  const sys=`你是"森感·智教"——面向智慧林业本科生森林环境感知课程的教学助手，课程覆盖激光雷达(空天地)、点云处理与森林参数反演、森林生态因子、智慧林业、物联网感知与林业气象传感器。请依据下列课程知识作答，讲解要通俗、循序渐进、联系林业实践与生态保护。\n课程知识：\n${ctx}`;
  return callModelRaw(sys,q,ai,900);
}
/* 通用大模型调用：支持 Anthropic Messages 协议与 OpenAI 兼容协议（DeepSeek/通义/智谱等国内模型均可直接接入） */
async function callModelRaw(sys,user,ai,maxTokens){
  const proto=ai.proto||'anthropic';
  if(proto==='openai'){
    const base=(ai.base||'').replace(/\/$/,'');
    const res=await fetch(base+'/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+ai.key},
      body:JSON.stringify({model:ai.model,max_tokens:maxTokens||900,messages:[{role:'system',content:sys},{role:'user',content:user}]})});
    if(!res.ok)throw new Error('http '+res.status);
    const d=await res.json();return d.choices[0].message.content;
  }
  const base=(ai.base||'https://api.anthropic.com').replace(/\/$/,'');
  const res=await fetch(base+'/v1/messages',{method:'POST',headers:{
    'content-type':'application/json','x-api-key':ai.key,'anthropic-version':'2023-06-01',
    'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:ai.model||'claude-sonnet-5',max_tokens:maxTokens||900,system:sys,
      messages:[{role:'user',content:user}]})});
  if(!res.ok)throw new Error('http '+res.status);
  const d=await res.json();return d.content.map(c=>c.text).join('');
}

/* 1) 激光雷达扫描与点云生成 */
function asimScan(host){
  const trees=[{x:130,w:80,h:130},{x:300,w:100,h:165},{x:470,w:70,h:110},{x:610,w:90,h:145}];
  const st={pulses:0,canopy:0,ground:0,multi:0,pts:[],platform:'als',rate:6,run:true};
  host.innerHTML='';
  host.appendChild(el('div','sim-controls',`
    <button class="btn sm" id="scRun">⏸ 暂停</button>
    <button class="btn sm warn" id="scReset">↺ 复位</button>
    <span class="muted" style="font-size:.82rem">平台：</span>
    <select class="ctl" id="scPlat"><option value="als">✈ 机载(俯扫)</option><option value="tls">▣ 地基(侧扫)</option><option value="sat">🛰 星载(大光斑)</option></select>
    <span class="muted" style="font-size:.82rem">脉冲频率：</span>
    <select class="ctl" id="scRate"><option value="3">低</option><option value="6" selected>中</option><option value="12">高</option></select>`));
  const kpi=el('div','grid g4');kpi.style.margin='12px 0';
  kpi.innerHTML=`<div class="stat"><div class="big" id="scP">0</div><div class="lbl">发射脉冲</div></div>
    <div class="stat"><div class="big" id="scC" style="color:var(--f-glow)">0</div><div class="lbl">冠层回波点</div></div>
    <div class="stat"><div class="big amber" id="scG">0</div><div class="lbl">地面回波点</div></div>
    <div class="stat"><div class="big blue" id="scM">0%</div><div class="lbl">多回波比例</div></div>`;
  host.appendChild(kpi);
  host.appendChild(mkCanvas('scCv',300));
  host.appendChild(el('div','moral','💡 机载俯扫冠层与地面都能打到、多回波丰富；地基侧扫树干信息强但冠层后方的地面被遮挡、地面点少；星载光斑大、点稀疏。切换平台对比点云分布差异。'));
  const draw=()=>{const c=cctx('scCv',300);if(!c)return;const{ctx,W,H}=c;const gy=H-24;
    ctx.clearRect(0,0,W,H);ctx.font='12px sans-serif';
    ctx.fillStyle='rgba(120,90,50,.22)';ctx.fillRect(0,gy,W,H-gy);
    ctx.strokeStyle='#8a6a3a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
    trees.forEach(t=>{const sx=t.x/720*W,ch2=t.h/300*H;ctx.fillStyle='rgba(47,140,76,.16)';
      ctx.beginPath();ctx.ellipse(sx,gy-ch2*0.55,t.w/720*W*0.55,ch2*0.5,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(120,80,40,.45)';ctx.fillRect(sx-2,gy-ch2*0.16,4,ch2*0.16);});
    ctx.fillStyle='var(--accent)';ctx.fillStyle='#74e69a';
    const lbl=st.platform==='als'?'✈ 机载平台（俯视扫描）':st.platform==='tls'?'▣ 地基扫描站（侧向扫描）':'🛰 星载平台（大光斑）';
    ctx.fillText(lbl,10,18);
    st.pts.forEach(p=>{ctx.fillStyle=p.g?'rgba(215,150,70,.9)':'rgba(120,230,150,.9)';ctx.fillRect(p.x/720*W,p.y/300*H,p.s,p.s);});
  };
  const tick=()=>{if(st.run){
    for(let i=0;i<st.rate;i++){st.pulses++;const x=20+Math.random()*680;
      let ct=0;trees.forEach(t=>{if(Math.abs(x-t.x)<t.w/2)ct=Math.max(ct,t.h);});
      const s=st.platform==='sat'?3:2;
      if(ct){const cy=300-24-ct*0.72-Math.random()*ct*0.22;st.pts.push({x,y:cy,g:false,s});st.canopy++;
        const pg=st.platform==='als'?0.6:st.platform==='tls'?0.15:0.4;
        if(Math.random()<pg){st.pts.push({x:x+(Math.random()-.5)*6,y:300-26,g:true,s});st.ground++;st.multi++;}
      }else{st.pts.push({x,y:300-26,g:true,s});st.ground++;}
    }
    if(st.pts.length>1800)st.pts.splice(0,st.pts.length-1800);

}

/* 2) 无人机机载航飞数据采集 */
function asimFlight(host){
  const cols=30,rows=16;
  const st={grid:new Array(cols*rows).fill(0),c:0,r:1,dir:1,lines:1,height:300,overlap:20,run:true,pts:0};
  const swathCells=()=>Math.max(2,Math.round(11-st.height/90)); // 高度越高带越宽? 视场固定→高度越高带越宽；此处以“覆盖格”表达
  host.innerHTML='';
  host.appendChild(el('div','sim-controls',`
    <button class="btn sm" id="flRun">⏸ 暂停</button>
    <button class="btn sm warn" id="flReset">↺ 复位</button>
    <span class="muted" style="font-size:.82rem">飞行高度：</span>
    <select class="ctl" id="flH"><option value="150">150m(低·密)</option><option value="300" selected>300m(中)</option><option value="600">600m(高·疏)</option></select>`));
  const kpi=el('div','grid g4');kpi.style.margin='12px 0';
  kpi.innerHTML=`<div class="stat"><div class="big" id="flL">1</div><div class="lbl">航线数</div></div>
    <div class="stat"><div class="big blue" id="flCov">0%</div><div class="lbl">覆盖率</div></div>
    <div class="stat"><div class="big" id="flSW">--</div><div class="lbl">扫描带宽(m)</div></div>
    <div class="stat"><div class="big amber" id="flD">--</div><div class="lbl">点密度(点/m²)</div></div>`;
  host.appendChild(kpi);
  host.appendChild(mkCanvas('flCv',300));
  host.appendChild(el('div','moral','💡 飞行高度越高，扫描带宽越大、单次覆盖越广，但点密度越低、精度下降；航线间需保持旁向重叠以保证拼接与完整覆盖。'));
  const swMeters=()=>Math.round(2*st.height*Math.tan(30*Math.PI/180)); // FOV≈60°
  const density=()=>Math.max(1,Math.round(60000/(swMeters()* (st.height/50)))); // 定性：高度↑密度↓
  const draw=()=>{const c=cctx('flCv',300);if(!c)return;const{ctx,W,H}=c;
    ctx.clearRect(0,0,W,H);const cw=W/cols,rh=H/rows;
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const v=st.grid[j*cols+i];
      ctx.fillStyle=v?'rgba(79,191,110,'+(0.25+0.5*Math.min(v,2)/2)+')':'rgba(120,150,120,.06)';
      ctx.fillRect(i*cw+0.5,j*rh+0.5,cw-1,rh-1);}
    // drone
    ctx.fillStyle='#e6a532';ctx.beginPath();ctx.arc(st.c*cw+cw/2,st.r*rh+rh/2,5,0,7);ctx.fill();
    ctx.fillStyle='#74e69a';ctx.font='12px sans-serif';ctx.fillText('✈ '+st.height+'m',6,16);};
  const tick=()=>{if(st.run){
    const half=Math.floor(swathCells()/2);
    for(let d=-half;d<=half;d++){const rr=st.r+d;if(rr>=0&&rr<rows){const idx=rr*cols+st.c;st.grid[idx]=Math.min((st.grid[idx]||0)+1,2);}}
    st.pts+=swathCells();
    st.c+=st.dir;
    if(st.c>=cols||st.c<0){st.dir*=-1;st.c=Math.max(0,Math.min(cols-1,st.c));
      const step=Math.max(1,swathCells()-Math.round(swathCells()*st.overlap/100));
      st.r+=step;st.lines++;
      if(st.r>=rows){st.r=1;}
    }
    const cov=st.grid.filter(v=>v>0).length/(cols*rows)*100;
    const L=$('flL');if(L){L.textContent=st.lines;$('flCov').textContent=Math.round(cov)+'%';
      $('flSW').textContent=swMeters();$('flD').textContent=density();}
  }draw();};
  const setRun=()=>{const b=$('flRun');if(b)b.textContent=st.run?'⏸ 暂停':'▶ 继续';};
  $('flRun').onclick=()=>{st.run=!st.run;setRun();};
  $('flReset').onclick=()=>{st.grid=new Array(cols*rows).fill(0);st.c=0;st.r=1;st.dir=1;st.lines=1;st.pts=0;};
  $('flH').onchange=e=>{st.height=+e.target.value;};
  ANIM.timer=setInterval(tick,90);draw();
}

/* 3) 点云滤波与CHM生成流水线（分阶段） */
function asimPipeline(host){
  const pts=[];for(let i=0;i<220;i++){const x=Math.random();const overTree=(x>0.15&&x<0.38)||(x>0.55&&x<0.82);
    const groundY=0.82-0.12*Math.sin(x*6);
    if(overTree&&Math.random()<0.72){pts.push({x,y:groundY-Math.random()*0.45-0.08,g:false});}
    else{pts.push({x,y:groundY+(Math.random()-.5)*0.03,g:true});}}
  const st={stage:0,t:0,run:true};const stages=['① 原始点云（地物混杂）','② 布料滤波：分离地面点/非地面点','③ 生成 DTM 与 DSM','④ CHM = DSM − DTM'];
  host.innerHTML='';
  host.appendChild(el('div','sim-controls',`
    <button class="btn sm" id="ppRun">⏸ 自动播放</button>
    <button class="btn sm" id="ppNext">下一阶段 →</button>
    <button class="btn sm warn" id="ppReset">↺ 复位</button>
    <span class="spacer"></span><span class="tag ok" id="ppStage" style="font-size:.82rem"></span>`));
  host.appendChild(mkCanvas('ppCv',320));
  const info=el('div','moral');info.id='ppInfo';host.appendChild(info);
  const INFO=['原始点云中地面点与植被点混杂，需先滤波分类。',
    '布料模拟滤波(CSF)：一块“布”在重力下贴合地表，落到最低层的点判为地面点(棕)，其余为植被点(绿)。',
    'DTM 由地面点内插生成、DSM 由最高点生成，二者刻画地面与地表包络。',
    'CHM = DSM − DTM，得到冠层高度(绿色带)，是提取树高的基础产品。'];
  const draw=()=>{const c=cctx('ppCv',320);if(!c)return;const{ctx,W,H}=c;ctx.clearRect(0,0,W,H);ctx.font='12px sans-serif';
    const X=x=>x*W,Y=y=>y*H;
    // DTM/DSM polylines
    const xs=[...Array(41)].map((_,i)=>i/40);
    const dtm=xs.map(x=>0.82-0.12*Math.sin(x*6));
    const dsmArr=xs.map(x=>{let m=0.82-0.12*Math.sin(x*6);pts.forEach(p=>{if(Math.abs(p.x-x)<0.03&&!p.g)m=Math.min(m,p.y);});return m;});
    if(st.stage>=2){ctx.strokeStyle='#d29646';ctx.lineWidth=2;ctx.beginPath();xs.forEach((x,i)=>{i?ctx.lineTo(X(x),Y(dtm[i])):ctx.moveTo(X(x),Y(dtm[i]))});ctx.stroke();
      ctx.strokeStyle='#4fbf6e';ctx.beginPath();xs.forEach((x,i)=>{i?ctx.lineTo(X(x),Y(dsmArr[i])):ctx.moveTo(X(x),Y(dsmArr[i]))});ctx.stroke();}
    if(st.stage>=3){ctx.fillStyle='rgba(79,191,110,.18)';ctx.beginPath();ctx.moveTo(X(0),Y(dsmArr[0]));
      xs.forEach((x,i)=>ctx.lineTo(X(x),Y(dsmArr[i])));for(let i=xs.length-1;i>=0;i--)ctx.lineTo(X(xs[i]),Y(dtm[i]));ctx.closePath();ctx.fill();}
    // points
    pts.forEach(p=>{let col;if(st.stage===0)col='rgba(150,200,160,.85)';else col=p.g?'rgba(215,150,70,.9)':'rgba(120,230,150,.9)';
      ctx.fillStyle=col;ctx.fillRect(X(p.x)-1.5,Y(p.y)-1.5,3,3);});
    // cloth line falling at stage1
    if(st.stage===1){const prog=Math.min(1,st.t/40);const clothY=xs.map(x=>{const g=0.82-0.12*Math.sin(x*6);let top=0.1;pts.forEach(p=>{if(Math.abs(p.x-x)<0.03&&!p.g)top=Math.max(top,1-p.y);});return 0.05+(1-prog)*0.0+ (g*prog);});
      ctx.strokeStyle='rgba(120,180,240,.8)';ctx.setLineDash([5,4]);ctx.beginPath();
      xs.forEach((x,i)=>{const yy=(0.1)+(dtm[i]-0.1)*prog;i?ctx.lineTo(X(x),Y(yy)):ctx.moveTo(X(x),Y(yy))});ctx.stroke();ctx.setLineDash([]);}
    // legend
    if(st.stage>=2){ctx.fillStyle='#d29646';ctx.fillText('— DTM 地面',8,H-24);ctx.fillStyle='#4fbf6e';ctx.fillText('— DSM 表面',8,H-10);}
  };
  const apply=()=>{const s=$('ppStage');if(s)s.textContent=stages[st.stage];const inf=$('ppInfo');if(inf)inf.innerHTML='💡 '+INFO[st.stage];draw();};
  const tick=()=>{if(st.run){st.t++;if(st.t>60){st.t=0;st.stage=(st.stage+1)%4;apply();}}draw();};
  $('ppRun').onclick=()=>{st.run=!st.run;$('ppRun').textContent=st.run?'⏸ 自动播放':'▶ 自动播放';};
  $('ppNext').onclick=()=>{st.run=false;$('ppRun').textContent='▶ 自动播放';st.t=0;st.stage=(st.stage+1)%4;apply();};
  $('ppReset').onclick=()=>{st.stage=0;st.t=0;apply();};
  ANIM.timer=setInterval(tick,60);apply();
}

/* 4) 冠层光穿透（比尔-朗伯） */
function asimLight(host){
  const st={lai:3,k:0.5,t:0,run:true,rays:[]};
  host.innerHTML='';
  host.appendChild(el('div','sim-controls',`
    <span class="muted" style="font-size:.82rem">叶面积指数 LAI：</span><b class="mono" id="ltLaiV" style="color:var(--accent)">3.0</b>
    <input type="range" id="ltLai" min="0.2" max="7" step="0.1" value="3" style="width:150px;accent-color:var(--f-leaf)">
    <span class="muted" style="font-size:.82rem">消光系数 k：</span><b class="mono" id="ltKV" style="color:var(--accent)">0.50</b>
    <input type="range" id="ltK" min="0.3" max="0.7" step="0.01" value="0.5" style="width:120px;accent-color:var(--f-leaf)">`));
  const kpi=el('div','grid g3');kpi.style.margin='12px 0';
  kpi.innerHTML=`<div class="stat"><div class="big amber" id="ltT">--</div><div class="lbl">林下透光率 I/I₀ (%)</div></div>
    <div class="stat"><div class="big" id="ltCC">--</div><div class="lbl">郁闭度 (%)</div></div>
    <div class="stat"><div class="big blue" id="ltF">e^(−k·LAI)</div><div class="lbl">比尔-朗伯定律</div></div>`;
  host.appendChild(kpi);
  host.appendChild(mkCanvas('ltCv',300));
  host.appendChild(el('div','moral','💡 光透过冠层按 I = I₀·e^(−k·LAI) 衰减：LAI 越大、林下越暗，郁闭度越高。这解释了为何郁闭林分林下幼苗更新受限、需通过抚育间伐调节透光。'));
  const draw=()=>{const c=cctx('ltCv',300);if(!c)return;const{ctx,W,H}=c;ctx.clearRect(0,0,W,H);
    const trans=Math.exp(-st.k*st.lai);
    // sky
    ctx.fillStyle='rgba(120,180,240,.10)';ctx.fillRect(0,0,W,H*0.18);
    ctx.fillStyle='#e6a532';ctx.beginPath();ctx.arc(W*0.5,H*0.09,10,0,7);ctx.fill();
    // canopy layers
    const layers=6;for(let i=0;i<layers;i++){const y=H*0.2+i*(H*0.5/layers);
      ctx.fillStyle='rgba(47,140,76,'+(0.10+0.06*st.lai/7)+')';ctx.fillRect(0,y,W,H*0.5/layers-2);}
    // rays
    const nr=14;for(let r=0;r<nr;r++){const x=W*(r+0.5)/nr;const phase=(st.t*0.04+r*0.6);
      const yTop=H*0.16,yBot=H*0.72;
      for(let seg=0;seg<12;seg++){const f=seg/12;const yy=yTop+(yBot-yTop)*((f+phase)%1);
        const depth=(yy-H*0.2)/(H*0.5);const inten=Math.max(0,Math.exp(-st.k*st.lai*Math.max(0,depth)));
        ctx.fillStyle='rgba(255,224,130,'+(0.55*inten).toFixed(3)+')';ctx.fillRect(x-1,yy,2,6);}}
    // ground light patch
    ctx.fillStyle='rgba(255,224,130,'+(0.15+0.6*trans).toFixed(3)+')';ctx.fillRect(0,H*0.74,W,H*0.1);
    ctx.fillStyle='rgba(120,90,50,.3)';ctx.fillRect(0,H*0.84,W,H*0.16);
    ctx.fillStyle='#dff3e4';ctx.font='12px sans-serif';ctx.fillText('林下透光 '+(trans*100).toFixed(1)+'%',10,H*0.8);};
  const upd=()=>{const trans=Math.exp(-st.k*st.lai);const T=$('ltT');if(T){T.textContent=(trans*100).toFixed(1);$('ltCC').textContent=((1-trans)*100).toFixed(0);}};
  const tick=()=>{st.t++;draw();};
  $('ltLai').oninput=e=>{st.lai=+e.target.value;$('ltLaiV').textContent=st.lai.toFixed(1);upd();};
  $('ltK').oninput=e=>{st.k=+e.target.value;$('ltKV').textContent=st.k.toFixed(2);upd();};
  ANIM.timer=setInterval(tick,60);upd();draw();
}

/* 5) 森林物联网感知网络 */
function asimIoT(host){
  const nodes=[{x:.12,y:.30},{x:.22,y:.62},{x:.34,y:.42},{x:.30,y:.80},{x:.48,y:.66},{x:.52,y:.32},{x:.64,y:.78},{x:.70,y:.48}];
  const gw={x:.82,y:.60},cloud={x:.88,y:.16};
  const st={t:0,run:true,itv:40,recv:0,alarm:-1,pkts:[],co2:420,logs:[]};
  host.innerHTML='';
  host.appendChild(el('div','sim-controls',`
    <button class="btn sm" id="ioRun">⏸ 暂停</button>
    <button class="btn sm warn" id="ioFire">🔥 触发火情</button>
    <button class="btn sm" id="ioReset">↺ 复位</button>
    <span class="muted" style="font-size:.82rem">采样间隔：</span>
    <select class="ctl" id="ioItv"><option value="70">慢</option><option value="40" selected>中</option><option value="18">快</option></select>`));
  const kpi=el('div','grid g4');kpi.style.margin='12px 0';
  kpi.innerHTML=`<div class="stat"><div class="big" id="ioN">8</div><div class="lbl">感知节点</div></div>
    <div class="stat"><div class="big blue" id="ioR">0</div><div class="lbl">云端接收包</div></div>
    <div class="stat"><div class="big amber" id="ioCO2">420</div><div class="lbl">最高CO₂(ppm)</div></div>
    <div class="stat"><div class="big" id="ioSt" style="color:var(--f-glow)">正常</div><div class="lbl">系统状态</div></div>`;
  host.appendChild(kpi);
  const grid=el('div','grid g2');
  grid.appendChild(mkCanvas('ioCv',300));
  grid.appendChild(el('div','panel-c','<div class="card-title">☁️ 云端日志</div><div class="log" id="ioLog" style="height:250px"></div>'));
  host.appendChild(grid);
  host.appendChild(el('div','moral','💡 “感—传—算”三位一体：节点(感)定时采样→LoRa汇聚到网关再上云(传)→云平台分析(算)。触发火情后，异常节点由“定时上报”切换为“实时报警”，秒级推送火警。'));
  const P=(o)=>({x:o.x,y:o.y});
  const emit=(ni,alarm)=>{const n=nodes[ni];st.pkts.push({from:P(n),via:P(gw),to:P(cloud),seg:0,p:0,alarm});};
  const ioLog=(m,cls)=>{const l=$('ioLog');if(!l)return;const d=el('div','ln '+(cls||''),`<span class="t">[${st.t}]</span>${m}`);l.insertBefore(d,l.firstChild);while(l.children.length>60)l.removeChild(l.lastChild);};
  const draw=()=>{const c=cctx('ioCv',300);if(!c)return;const{ctx,W,H}=c;ctx.clearRect(0,0,W,H);ctx.font='11px sans-serif';
    ctx.fillStyle='rgba(47,140,76,.05)';ctx.fillRect(0,0,W,H);
    // links
    ctx.strokeStyle='rgba(120,180,140,.25)';ctx.lineWidth=1;
    nodes.forEach(n=>{ctx.beginPath();ctx.moveTo(n.x*W,n.y*H);ctx.lineTo(gw.x*W,gw.y*H);ctx.stroke();});
    ctx.beginPath();ctx.moveTo(gw.x*W,gw.y*H);ctx.lineTo(cloud.x*W,cloud.y*H);ctx.stroke();
    // gateway & cloud
    ctx.fillStyle='#4aa3d4';ctx.fillText('📡网关',gw.x*W-14,gw.y*H+4);
    ctx.fillStyle=st.alarm>=0?'#e8583f':'#74e69a';ctx.fillText('☁云平台',cloud.x*W-16,cloud.y*H+4);
    // nodes
    nodes.forEach((n,i)=>{ctx.fillStyle=i===st.alarm?'#e8583f':'#4fbf6e';ctx.beginPath();ctx.arc(n.x*W,n.y*H,i===st.alarm?7:5,0,7);ctx.fill();});
    // packets
    st.pkts.forEach(pk=>{const a=pk.seg===0?pk.from:pk.via,b=pk.seg===0?pk.via:pk.to;
      const x=a.x+(b.x-a.x)*pk.p,y=a.y+(b.y-a.y)*pk.p;ctx.fillStyle=pk.alarm?'#f0682e':'#e6f7ea';ctx.beginPath();ctx.arc(x*W,y*H,pk.alarm?4:3,0,7);ctx.fill();});
  };
  const tick=()=>{if(st.run){st.t++;
    if(st.t%st.itv===0){for(let i=0;i<nodes.length;i++)emit(i,false);}
    if(st.alarm>=0&&st.t%6===0){emit(st.alarm,true);st.co2=Math.min(5000,st.co2+120);}
    st.pkts.forEach(pk=>{pk.p+=0.06;if(pk.p>=1){pk.p=0;pk.seg++;if(pk.seg>1){pk._done=1;st.recv++;
      if(pk.alarm){ioLog('🔥 火警! 异常节点CO₂↑ 温度↑ 已实时推送','hot');}
    }}});
    st.pkts=st.pkts.filter(pk=>!pk._done);
    if(st.t%st.itv===1){ioLog('✓ 8个节点采样上报（温/湿/CO₂）','ok');}
    const R=$('ioR');if(R){R.textContent=st.recv;$('ioCO2').textContent=Math.round(st.co2);
      const s=$('ioSt');s.textContent=st.alarm>=0?'🔥 火警':'正常';s.style.color=st.alarm>=0?'#e8583f':'#74e69a';}
  }draw();};
  const setRun=()=>{const b=$('ioRun');if(b)b.textContent=st.run?'⏸ 暂停':'▶ 继续';};
  $('ioRun').onclick=()=>{st.run=!st.run;setRun();};
  $('ioFire').onclick=()=>{st.alarm=Math.floor(Math.random()*nodes.length);ioLog('⚠ 节点'+(st.alarm+1)+' 触发火情：切换为实时报警模式','hot');};
  $('ioReset').onclick=()=>{st.alarm=-1;st.recv=0;st.co2=420;st.pkts=[];const l=$('ioLog');if(l)l.innerHTML='';};
  ANIM.timer=setInterval(tick,80);draw();
}

function bindSim(){

function simResetState(){
  simRT.count=0;simRT.data=[];simRT.chart=[];
  simRT.nodes=NODES.map(n=>({...n,cur:20,prev:20,min:999,max:-999,hum:0,light:0}));
}
function simStart(){if(simRT.running)return;simRT.running=true;simLog('数据采集已启动','ok');simTick();simRT.timer=setInterval(simTick,simRT.interval);logAct('sim','温度仿真·'+SCENES[simRT.scene].name)}
function simStop(){simRT.running=false;clearInterval(simRT.timer);
  if(simRT.count>0){const sims=DB.get(DB.k.sims,[]);sims.push({id:uid('s'),u:S.user.u,name:S.user.name,scene:SCENES[simRT.scene].name,samples:simRT.count,ts:Date.now()});DB.set(DB.k.sims,sims)}
}
function rnd(a,b){return +(a+Math.random()*(b-a)).toFixed(1)}
function simTick(){
  const sc=SCENES[simRT.scene];simRT.count++;
  simRT.nodes.forEach((s,i)=>{
    s.prev=s.cur;
    s.cur=+(sc.base[i]+(Math.random()-.5)*sc.noise+Math.sin(simRT.count*.15+i)*sc.noise*.3).toFixed(1);
    s.hum=rnd(...sc.hum);s.light=Math.round(rnd(...sc.light));
    s.min=Math.min(s.min,s.cur);s.max=Math.max(s.max,s.cur);
    let color='var(--f-glow)',cls='';
    if(s.cur>=40){color='var(--amber-hot)';cls='alert'}else if(s.cur>=30){color='var(--amber)'}else if(s.cur<=5){color='var(--cold)';cls='cold'}
    const num=$('num'+i);if(!num)return;
    num.textContent=s.cur.toFixed(1);num.style.color=color;
    $('mx'+i).textContent=s.max.toFixed(1);$('mn'+i).textContent=s.min.toFixed(1);
    $('hu'+i).textContent=s.hum+'%';$('li'+i).textContent=s.light+'lx';
    const pct=Math.min(Math.max((s.cur+10)/70,0),1),circ=2*Math.PI*40;
    const ring=$('ring'+i);ring.setAttribute('stroke-dasharray',`${pct*circ} ${circ}`);ring.setAttribute('stroke',color);
    $('simCards').children[i].className='sensor-card '+cls;
    simRT.data.push({ts:new Date().toLocaleString('zh-CN'),id:s.id,loc:s.loc,temp:s.cur,hum:s.hum,light:s.light});
    let lc='ok',tag='正常';
    if(s.cur>=45){lc='hot';tag='⚠高温危险'}else if(s.cur>=35){lc='warn';tag='↑偏高'}else if(s.cur<=0){lc='cold';tag='↓低温警报'}
    simLog(`${s.id} → ${s.cur.toFixed(1)}℃ 湿${s.hum}% 光${s.light}lx [${tag}]`,lc);
  });
  const temps=simRT.nodes.map(s=>s.cur);
  $('kAvg').textContent=(temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1);
  $('kMax').textContent=Math.max(...temps).toFixed(1);$('kMin').textContent=Math.min(...temps).toFixed(1);$('kCnt').textContent=simRT.count;
  simRT.chart.push(temps.slice());if(simRT.chart.length>60)simRT.chart.shift();
  drawSimChart();
}
function simLog(msg,cls){const l=$('simLog');if(!l)return;
  const d=el('div','ln '+(cls||''),`<span class="t">[${new Date().toLocaleTimeString('zh-CN',{hour12:false})}]</span>${msg}`);
  l.insertBefore(d,l.firstChild);while(l.children.length>80)l.removeChild(l.lastChild)}
function drawSimChart(){
  const cv=$('simChart');if(!cv||simRT.chart.length<2)return;
  const ctx=cv.getContext('2d'),dpr=devicePixelRatio||1,W=cv.offsetWidth,H=cv.offsetHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const all=simRT.chart.flat(),mn=Math.min(...all)-3,mx=Math.max(...all)+3,rg=mx-mn||1;
  const pL=34,pR=10,pT=10,pB=18,gW=W-pL-pR,gH=H-pT-pB;
  const cs=getComputedStyle(document.documentElement);
  ctx.strokeStyle=cs.getPropertyValue('--border').trim()||'rgba(255,255,255,.08)';ctx.lineWidth=1;
  for(let g=0;g<=4;g++){const y=pT+g/4*gH;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();
    ctx.fillStyle=cs.getPropertyValue('--ink-3').trim();ctx.font='9px monospace';ctx.fillText((mx-g/4*rg).toFixed(0)+'°',2,y+3)}
  const colors=['#4fbf6e','#e6a532','#4aa3d4','#9a7ce0'];
  for(let n=0;n<4;n++){ctx.beginPath();
    simRT.chart.forEach((row,vi)=>{const x=pL+vi/59*gW,y=pT+(1-(row[n]-mn)/rg)*gH;vi?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    ctx.strokeStyle=colors[n];ctx.lineWidth=1.6;ctx.stroke();
    const last=simRT.chart[simRT.chart.length-1][n],lx=pL+(simRT.chart.length-1)/59*gW,ly=pT+(1-(last-mn)/rg)*gH;
    ctx.beginPath();ctx.arc(lx,ly,3,0,7);ctx.fillStyle=colors[n];ctx.fill()}
}
function simExport(){
  if(simRT.data.length===0){toast('暂无数据，请先开始采集');return}
  let csv='﻿时间,传感器编号,节点,温度℃,湿度%,光照lux\n';
  simRT.data.forEach(r=>csv+=`${r.ts},${r.id},${r.loc},${r.temp},${r.hum},${r.light}\n`);
  downloadFile(csv,`森林温度数据_${new Date().toLocaleDateString('zh-CN')}.csv`,'text/csv');
  toast('已导出 '+simRT.data.length+' 条数据');logAct('sim','导出CSV·'+simRT.data.length+'条');
}
function downloadFile(content,name,type){
  try{if(window.claude&&window.claude.downloads){window.claude.downloads.save({filename:name,data:content});return}}catch(e){}
  const blob=new Blob([content],{type:type+';charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

function normAns(s){return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'').replace(/[，。．、；;,\.]/g,'')}
function fillCorrect(q,ans){const n=normAns(ans);return n!==''&&q.a.some(x=>normAns(x)===n)}
function multiCorrect(q,ans){if(!Array.isArray(ans))return false;const a=[...ans].sort().join(','),b=[...q.a].sort().join(',');return a===b&&ans.length>0}
function qCorrect(q,ans){return q.type==='fill'?fillCorrect(q,ans):q.type==='multi'?multiCorrect(q,ans):ans===q.a}
function qTypeLabel(t){return t==='judge'?'判断':t==='fill'?'填空':t==='multi'?'多选':'单选'}
/* 自适应组卷：优先编入该生此前答错过的题（最多 3 道），其余随机——同一专题每次重测都"盯着薄弱点"出题 */
function startQuiz(chId,customPool,label){
  let pool=customPool||[...QUIZ.filter(q=>q.ch===chId),...FILL.filter(q=>q.ch===chId).map(q=>({...q,type:'fill'}))];
  let qs;
  if(customPool){qs=pool.map(q=>({...q})).sort(()=>Math.random()-.5).slice(0,10);}
  else{
    const wrongSet=new Set(wrongQuestions(S.user.u).filter(w=>w.ch===chId).map(w=>w.q));
    const prio=pool.filter(q=>wrongSet.has(q.q)).sort(()=>Math.random()-.5).slice(0,3);
    const rest=pool.filter(q=>!prio.includes(q)).sort(()=>Math.random()-.5).slice(0,8-prio.length);
    qs=[...prio,...rest].map(q=>({...q})).sort(()=>Math.random()-.5);
  }
  const answers=qs.map(q=>q.type==='multi'?[]:null);
  S.quizState={ch:chId,qs,answers,submitted:false,label:label||null,adaptive:!customPool&&qs.some(q=>wrongQuestions(S.user.u).some(w=>w.q===q.q))};
  go('quiz');
}
function renderQuizRun(){
  const st=S.quizState;const wrap=el('div');
  wrap.appendChild(el('div','row',`<button class="btn ghost sm" id="quizBack">← 返回选专题</button><b style="font-family:var(--serif)">${st.label||(chShort(st.ch)+' · 测验')}</b><span class="spacer"></span><span class="muted">共 ${st.qs.length} 题</span>`));
  const list=el('div');list.style.marginTop='14px';
  if(st.adaptive&&!st.submitted)wrap.appendChild(el('div','moral','🎯 <b>自适应组卷</b>：本次测验已优先编入你此前答错过的题目（标 🔁），针对薄弱点再练一次。'));
  const wrongSet=new Set(wrongQuestions(S.user.u).map(w=>w.q));
  st.qs.forEach((q,qi)=>{
    const card=el('div','quiz-q');
    card.appendChild(el('div','qh',`<b>${qi+1}.</b> ${q.q} <span class="tag info" style="margin-left:6px">${qTypeLabel(q.type)}</span>${wrongSet.has(q.q)?'<span class="tag warn" style="margin-left:4px">🔁 曾答错</span>':''}`));
    if(q.type==='fill'){
      if(!st.submitted){
        const inp=el('input','ctl');inp.style.width='100%';inp.placeholder='在此填写答案';inp.value=st.answers[qi]||'';
        inp.oninput=()=>{st.answers[qi]=inp.value};
        card.appendChild(inp);
      }else{
        const ok=fillCorrect(q,st.answers[qi]);
        const row=el('div','opt '+(ok?'right':'wrong'));
        row.innerHTML=`<span class="k">${ok?'✓':'✗'}</span>`;
        const sp=el('span');sp.textContent='你的答案：'+((st.answers[qi]||'').trim()||'（未填写）');
        row.appendChild(sp);card.appendChild(row);
        card.appendChild(el('div','explain',`✅ 参考答案：${q.a[0]}　💡 ${q.ex}`));
      }
    }else{
      const isMulti=q.type==='multi';
      q.o.forEach((opt,oi)=>{
        const o=el('div','opt');const key=String.fromCharCode(65+oi);
        o.innerHTML=`<span class="k">${key}</span><span>${opt}</span>`;
        if(st.submitted){
          const correctSet=isMulti?q.a:[q.a];
          const chosen=isMulti?st.answers[qi]:[st.answers[qi]];
          if(correctSet.includes(oi))o.classList.add('right');
          if(chosen.includes(oi)&&!correctSet.includes(oi))o.classList.add('wrong');
        }else{
          const chosen=isMulti?st.answers[qi]:[st.answers[qi]];
          if(chosen.includes(oi))o.classList.add('sel');
          o.onclick=()=>{
            if(isMulti){const arr=st.answers[qi];const p=arr.indexOf(oi);if(p>=0)arr.splice(p,1);else arr.push(oi);}
            else st.answers[qi]=oi;
            go('quiz');
          };
        }
        card.appendChild(o);
      });
      if(st.submitted)card.appendChild(el('div','explain','💡 '+q.ex));
    }
    list.appendChild(card);
  });
  wrap.appendChild(list);
  if(!st.submitted){
    const btn=el('button','btn primary','提交并查看讲评');btn.style.width='auto';btn.onclick=submitQuiz;
    wrap.appendChild(btn);
  }else{
    const correct=st.qs.filter((q,i)=>qCorrect(q,st.answers[i])).length;
    const score=Math.round(correct/st.qs.length*100);
    const res=el('div','panel-c');res.style.marginBottom='14px';
    res.innerHTML=`<div class="row"><div style="font-size:2.2rem">${score>=80?'🎉':score>=60?'👍':'💪'}</div>
      <div><h3>得分 <span style="color:var(--accent)">${score}</span> / 100</h3>
      <p class="muted">答对 ${correct}/${st.qs.length} 题${score>=80?' · 掌握扎实！':score>=60?' · 继续加油':' · 建议重温本专题知识'}</p></div>
      <span class="spacer"></span><button class="btn" id="quizAgain">再做一次</button></div>`;
    wrap.insertBefore(res,list);
    // 智能反馈：根据本次错题给出下一步学习建议（知识要点 / 仿真 / 错题本）
    const wrongNow=st.qs.filter((q,i)=>!qCorrect(q,st.answers[i]));
    if(wrongNow.length){
      const fb=el('div','panel-c');fb.style.marginBottom='14px';
      const secs=[...new Set(wrongNow.map(q=>q.sec).filter(Boolean))];
      fb.innerHTML=`<div class="card-title">🤖 智能反馈 · 下一步建议</div>
        <p class="muted" style="font-size:.84rem;line-height:1.8">本次失分集中在：${secs.map(x=>`<span class="tag warn">${x}</span>`).join(' ')||'（综合）'}。系统已把这 ${wrongNow.length} 道题记入<b>错题本</b>，下次本专题测验将优先重练。</p>`;
      const bar=el('div','row');bar.style.marginTop='8px';
      const b1=el('button','btn sm','📖 复习本专题知识要点');b1.onclick=()=>{S.quizState=null;S.chapter=st.ch||null;go('course')};
      const b2=el('button','btn sm','📕 打开错题本');b2.onclick=()=>{S.quizState=null;go('wrongbook')};
      bar.appendChild(b1);bar.appendChild(b2);
      const sims=[...(typeof ASIMS!=='undefined'?ASIMS:[]).filter(a=>a.ch===st.ch),...SIMCASES.filter(x=>x.ch===st.ch)].slice(0,1);
      sims.forEach(a=>{const b=el('button','btn sm','🧪 配套仿真：'+a.name);b.onclick=()=>{S.quizState=null;if(a.inputs)S.simcase=a.id;else S.asim=a.id;go('simcase')};bar.appendChild(b)});
      fb.appendChild(bar);wrap.insertBefore(fb,list);
    }
    setTimeout(()=>{$('quizAgain').onclick=()=>st.label?go('wrongbook'):startQuiz(st.ch)},0);
  }
  setTimeout(()=>{$('quizBack').onclick=()=>{S.quizState=null;go('quiz')}},0);
  return wrap;
}
function submitQuiz(){
  const st=S.quizState;
  const blank=st.answers.some((a,i)=>{const t=st.qs[i].type;
    if(t==='fill')return String(a==null?'':a).trim()==='';
    if(t==='multi')return !Array.isArray(a)||a.length===0;
    return a===null;});
  if(blank){toast('还有题目未作答');return}
  st.submitted=true;
  const correct=st.qs.filter((q,i)=>qCorrect(q,st.answers[i])).length;
  const score=Math.round(correct/st.qs.length*100);
  const log=DB.get(DB.k.quiz,[]);
  // wrong：本次答错的题（题干+专题+题型），供错题本与自适应组卷使用
  const wrong=st.qs.map((q,i)=>qCorrect(q,st.answers[i])?null:{q:q.q,ch:q.ch,type:q.type}).filter(Boolean);
  log.push({id:uid('q'),u:S.user.u,name:S.user.name,ch:st.ch,section:st.label||chShort(st.ch),score,total:st.qs.length,wrong,ts:Date.now()});
  DB.set(DB.k.quiz,log);logAct('quiz',(st.label||chShort(st.ch)+'测验')+' '+score+'分');
  go('quiz');
}

function renderStudy(){
  const {ch,kind}=S.study;

  const wrap=el('div');

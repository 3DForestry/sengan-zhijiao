  wrap.appendChild(el('div','row',`<button class="btn ghost sm" id="studyBack">← 返回选专题</button><b style="font-family:var(--serif)">${chShort(ch)}</b><span class="spacer"></span><span class="muted">${isShort?'简答自练':'论述研习'} · ${bank.length} 题</span>`));
  const list=el('div');list.style.marginTop='14px';
  const openLabel=isShort?'查看参考答案':'查看答题思路';
  const lockLabel=isShort?'🔒 提交后查看参考答案':'🔒 提交后查看答题思路';
  const headLabel=isShort?'✅ <b>参考要点</b>':'📜 <b>答题思路</b>';
  const scenPrefix=isShort?'简答·':'论述·';
  bank.forEach((q,qi)=>{
    const card=el('div','quiz-q');let logged=false;
    card.appendChild(el('div','qh',`<b>${qi+1}.</b> ${q.q} <span class="tag ${isShort?'cold':'violet'}" style="margin-left:6px">${isShort?'简答':'论述'}</span>`));
    const ta=el('textarea','ta');ta.placeholder=isShort?'先写下你的答案 →「提交老师批阅」后即可查看参考答案自评…':'先写下你的论述与观点 →「提交老师批阅」后即可查看答题思路…';
    card.appendChild(ta);
    const bar=el('div','row');bar.style.marginTop='10px';
    const revealBtn=el('button','btn sm',lockLabel);
    bar.appendChild(revealBtn);card.appendChild(bar);
    const ans=el('div','explain');ans.style.display='none';
    const pts=isShort?q.pts:q.guide;
    ans.innerHTML=headLabel+'<ul style="margin:8px 0 0 18px;line-height:1.9">'+pts.map(p=>`<li>${p}</li>`).join('')+'</ul>';
    card.appendChild(ans);
    const hasSubmitted=()=>DB.get(DB.k.subs,[]).some(s=>s.u===S.user.u&&s.kind===kind&&s.q===q.q);
    const syncReveal=()=>{if(ans.style.display==='block'){revealBtn.textContent='收起';return}revealBtn.textContent=hasSubmitted()?openLabel:lockLabel;};
    revealBtn.onclick=()=>{
      if(ans.style.display==='none'){
        if(!hasSubmitted()){toast('请先提交答案，再查看'+(isShort?'参考答案':'答题思路'));return}
        ans.style.display='block';revealBtn.textContent='收起';
        if(!logged){logged=true;logAct('study',scenPrefix+chShort(ch))}
      }else{ans.style.display='none';syncReveal();}
    };
    const submitBtn=el('button','btn sm primary','📤 提交老师批阅');submitBtn.style.width='auto';
    bar.appendChild(submitBtn);
    const status=el('div');status.style.cssText='font-size:.8rem;margin-top:8px';
    card.appendChild(status);
    const refresh=()=>{const sub=DB.get(DB.k.subs,[]).filter(s=>s.u===S.user.u&&s.kind===kind&&s.q===q.q).sort((a,b)=>b.ts-a.ts)[0];
      syncReveal();
      if(!sub){status.innerHTML='';return}
      if(!ta.value)ta.value=sub.analysis;
      status.innerHTML=sub.graded?`👨‍🏫 已批阅 <span class="tag ok">${sub.grade}</span> ${escapeHtml(sub.comment||'')}`:'🕑 已提交，等待教师批阅（可修改答案后重新提交）';
      if(sub.ai){status.appendChild(aiFeedbackBox(sub));}
    };
    submitBtn.onclick=()=>{
      const val=ta.value.trim();if(!val){toast('请先写下你的作答');return}
      const subs=DB.get(DB.k.subs,[]);
      let sub=subs.find(s=>s.u===S.user.u&&s.kind===kind&&s.q===q.q&&!s.graded);
      if(sub){sub.analysis=val;sub.ts=Date.now();}
      else{sub={id:'sub'+Date.now()+Math.floor(Math.random()*1e3),u:S.user.u,name:S.user.name,kind,ch,q:q.q,ref:pts,scenario:scenPrefix+chShort(ch),analysis:val,grade:'',comment:'',ts:Date.now(),graded:false};subs.push(sub);}
      sub.ai=autoAssess(sub);
      DB.set(DB.k.subs,subs);logAct('study','提交'+scenPrefix+chShort(ch));
      toast('已提交，可查看'+(isShort?'参考答案':'答题思路'));refresh();
      aiFeedbackLLM(sub,refresh);
    };
    refresh();
    list.appendChild(card);
  });
  wrap.appendChild(list);
  setTimeout(()=>{$('studyBack').onclick=()=>{S.study=null;go('quiz')}},0);
  return wrap;
}

/* 解析名单文本：支持 逗号/制表符/分号/空格 分隔，自动识别表头（学号/姓名/班级），无表头时按"学号 姓名 班级"或"姓名 学号 班级"自动判断 */
function parseRoster(text){
  const lines=String(text||'').replace(/^﻿/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=lines.map(l=>{let c=l.split(/[,\t;，；]/);if(c.length<2)c=l.split(/\s+/);return c.map(x=>x.trim().replace(/^"|"$/g,''))}).filter(r=>r.some(Boolean));
  if(!rows.length)return{items:[],bad:[]};
  let iu=0,inm=1,ic=2;
  const head=rows[0];
  const hi=k=>head.findIndex(h=>h.includes(k));
  if(hi('学号')>=0||hi('姓名')>=0){iu=hi('学号')>=0?hi('学号'):hi('账号');inm=hi('姓名');ic=hi('班级');rows.shift();}
  else{const r=rows[0];if(r.length>=2&&!/^[\dA-Za-z_-]+$/.test(r[0])&&/^[\dA-Za-z_-]+$/.test(r[1])){iu=1;inm=0;}}
  const items=[],bad=[];
  rows.forEach((r,i)=>{const u=iu>=0?(r[iu]||''):'',name=inm>=0?(r[inm]||''):'',cls=ic>=0&&r[ic]?r[ic]:'';
    if(!u||!name)bad.push('第'+(i+1)+'行：'+r.join(' '));else items.push({u,name,cls});});
  return{items,bad};
}
function applyRoster(items,defaultCls){
  const users=DB.get(DB.k.users,[]);let added=0,updated=0;
  items.forEach(it=>{const cls=it.cls||defaultCls||'未分班';const s=users.find(x=>x.u===it.u);
    if(s){if(s.role!=='student')return;s.name=it.name;s.cls=cls;updated++;}
    else{users.push({u:it.u,p:DEFAULT_PWD,role:'student',name:it.name,cls});added++;}});
  DB.set(DB.k.users,users);return{added,updated};
}

function wrongQuestions(u){
  const m={};

const DRILL_ASPECTS=[['风险研判',/研判|风险|等级|判断|判定|预警|高危|危险/],['数据依据',/℃|°C|温度|湿度|风速|阈值|升温|降至|降到|m\/s|%/],

function cjkBigrams(str){const set=new Set();(str.match(/[一-龥]{2,}/g)||[]).forEach(run=>{for(let i=0;i<run.length-1;i++)set.add(run.slice(i,i+2))});return set}
function latinTokens(str){return (str.match(/[A-Za-z][A-Za-z0-9\-]{1,}/g)||[]).map(x=>x.toLowerCase())}
function autoAssess(sub){
  const txt=String(sub.analysis||'');const tl=txt.toLowerCase();
  let cover=[];
  if(isWritten(sub)){
    (sub.ref||[]).forEach(pt=>{const bg=[...cjkBigrams(pt)],lt=latinTokens(pt);
      const hitB=bg.filter(b=>txt.includes(b)).length,hitL=lt.filter(t=>tl.includes(t)).length;
      const hit=hitL>0||(bg.length&&hitB/bg.length>=0.25)||hitB>=3;
      cover.push({k:pt.replace(/[：:].*$/,'').slice(0,14),hit})});
  }else cover=DRILL_ASPECTS.map(([k,re])=>({k,hit:re.test(txt)}));
  const total=cover.length||1,hit=cover.filter(c=>c.hit).length,ratio=hit/total;
  let grade=ratio>=.8?'A':ratio>=.6?'B':ratio>=.4?'C':'D';
  if(txt.length<40&&grade<'C')grade='C';
  const miss=cover.filter(c=>!c.hit).map(c=>c.k);
  const tips=miss.length?`可补充：${miss.slice(0,3).join('、')}${miss.length>3?' 等':''}。`:'要点覆盖完整。'+(txt.length<80?'可进一步展开论证与数据依据。':'');
  const comment=(grade==='A'?'研判有据、要点完整，':grade==='B'?'思路清晰、要点较全，':grade==='C'?'有基本判断，但要点不够完整，':'作答偏简单，')+tips;
  return{grade,hit,total,cover,tips,comment,src:'规则引擎'};
}

/* ---- 增值评价（首测 vs 末测） ---- */
function valueAdded(){
  const users=DB.get(DB.k.users,[]).filter(u=>u.role==='student');
  const rows=users.map(u=>{const ms=masteryOf(u.u).filter(m=>m.n>=1);
    if(!ms.length)return null;
    const first=Math.round(ms.reduce((s,m)=>s+m.first,0)/ms.length),latest=Math.round(ms.reduce((s,m)=>s+m.latest,0)/ms.length);
    return{u:u.u,name:u.name,cls:u.cls,first,latest,delta:latest-first,topics:ms.length,retested:ms.filter(m=>m.n>=2).length}}).filter(Boolean);
  const byTopic=CH.map(c=>{const fs=[],ls=[];users.forEach(u=>{const m=masteryOf(u.u).find(x=>x.ch===c.id);if(m&&m.n>=2){fs.push(m.first);ls.push(m.latest)}});
    return{ch:c.id,n:fs.length,first:fs.length?Math.round(fs.reduce((a,b)=>a+b,0)/fs.length):null,latest:ls.length?Math.round(ls.reduce((a,b)=>a+b,0)/ls.length):null}}).filter(t=>t.n);
  return{rows:rows.sort((a,b)=>b.delta-a.delta),byTopic};
}

/* ---- 内容扩展包：教师可导入自己的知识卡片与客观题（JSON），无需改代码即可迁移到其他课程 ---- */
function applyExt(ext){
  for(let i=KB.length-1;i>=0;i--)if(KB[i].ext)KB.splice(i,1);
  for(let i=QUIZ.length-1;i>=0;i--)if(QUIZ[i].ext)QUIZ.splice(i,1);
  if(!ext)return{kb:0,quiz:0};
  const kb=(ext.kb||[]).filter(k=>k&&k.title&&k.sum&&Array.isArray(k.pts)).map(k=>({ch:+k.ch||1,sec:k.sec||k.title,title:k.title,kw:Array.isArray(k.kw)?k.kw:[k.title],sum:k.sum,pts:k.pts,formula:k.formula,ext:true}));
  const qz=(ext.quiz||[]).filter(q=>q&&q.q&&Array.isArray(q.o)&&q.a!=null).map(q=>({ch:+q.ch||1,type:q.type==='multi'?'multi':q.type==='judge'?'judge':'single',sec:q.sec||'',q:q.q,o:q.o,a:q.type==='multi'?(Array.isArray(q.a)?q.a.map(Number):[+q.a]):+q.a,ex:q.ex||'',ext:true}));
  kb.forEach(k=>KB.push(k));qz.forEach(q=>QUIZ.push(q));
  return{kb:kb.length,quiz:qz.length};
}

   ============================================================ */
let authRole='student';
const HINT_STU='🎓 <b>已注册</b>的同学直接输学号+密码登录；<b>新同学</b>请点下方“注册”，填写真实姓名、学号、班级。（体验账号：student01 / 123456）';
const HINT_TEA='👨‍🏫 <b>已注册</b>的老师直接输工号+密码登录；<b>新教师</b>请点下方“注册”，填写真实姓名、工号、院系。（演示账号：teacher / 123456）';
const REG_CFG={
  student:{hint:'📝 请填写<b>真实信息</b>注册，教师端将据此汇总你的学习与成绩。',
    namePh:'如：张三',userLbl:'学号（作登录账号）',userPh:'如：2022012345',
    clsLbl:'班级',clsPh:'如：智慧林业2201',link:'新同学？<a>用真实姓名·学号·班级注册</a>'},
  teacher:{hint:'📝 请填写<b>真实信息</b>注册（真实姓名·工号·院系）。将以此身份汇总并评阅学生数据。',
    namePh:'如：李老师',userLbl:'工号（作登录账号）',userPh:'如：T2015008',
    clsLbl:'院系 / 教研室',clsPh:'如：××学院·智慧林业教研室',link:'新教师？<a>用真实姓名·工号·院系注册</a>'}
};
function applyRegCfg(){const c=REG_CFG[authRole];
  $('regHint').innerHTML=c.hint;$('regName').placeholder=c.namePh;
  $('regUserLbl').textContent=c.userLbl;$('regUser').placeholder=c.userPh;
  $('regClassLbl').textContent=c.clsLbl;$('regClass').placeholder=c.clsPh;
  $('toRegister').innerHTML=c.link;
}
function showRegister(){$('loginForm').style.display='none';$('registerForm').style.display='block';$('regErr').textContent=''}
function showLogin(){$('registerForm').style.display='none';$('loginForm').style.display='block'}
$('roleTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  authRole=b.dataset.r;[...$('roleTabs').children].forEach(x=>x.classList.toggle('on',x===b));
  const stu=authRole==='student';
  $('demoHint').innerHTML=stu?HINT_STU:HINT_TEA;
  $('toRegister').style.display='block';
  $('loginUserLbl').textContent=stu?'学号 / 账号':'工号 / 账号';
  $('loginUser').placeholder=stu?'请输入你的学号':'请输入你的工号';
  applyRegCfg();showLogin();$('loginErr').textContent='';
});
$('demoHint').innerHTML=HINT_STU;
$('toRegister').onclick=showRegister;
$('toLogin').onclick=showLogin;
$('loginBtn').onclick=()=>{
  const u=$('loginUser').value.trim(),p=$('loginPass').value.trim();
  const isTea=authRole==='teacher';
  if(!u){$('loginErr').textContent='请输入'+(isTea?'工号':'学号');return}
  if(NET.on){ // 课堂服务器模式：密码在服务器校验，本地缓存里不含密码
    $('loginErr').textContent='';
    NET.api('/api/login',{u,p,role:authRole}).then(d=>loginAs(d.user)).catch(e=>{
      if(e.status===404){$('loginErr').textContent='该'+(isTea?'工号':'学号')+'尚未注册，请先注册';$('regUser').value=u;showRegister();applyRegCfg();}
      else $('loginErr').textContent=e.message||'登录失败';
    });
    return;
  }
  const user=DB.get(DB.k.users,[]).find(x=>x.u===u&&x.role===authRole);
  if(!user){$('loginErr').textContent='该'+(isTea?'工号':'学号')+'尚未注册，请先注册';$('regUser').value=u;showRegister();applyRegCfg();return;}
  if(user.p!==p){$('loginErr').textContent='密码错误';return}
  loginAs(user);
};
$('regBtn').onclick=()=>{
  const name=$('regName').value.trim(),u=$('regUser').value.trim(),cls=$('regClass').value.trim(),p=$('regPass').value.trim();
  const isTea=authRole==='teacher';
  if(!name||!u||!cls||!p){$('regErr').textContent='请完整填写真实姓名、'+(isTea?'工号、院系':'学号、班级')+'和密码';return}
  if(NET.on){
    $('regErr').textContent='';
    NET.api('/api/register',{u,p,role:authRole,name,cls}).then(d=>{NET.poll();loginAs(d.user)}).catch(e=>{$('regErr').textContent=e.message||'注册失败'});
    return;
  }
  const users=DB.get(DB.k.users,[]);
  if(users.find(x=>x.u===u)){$('regErr').textContent='该'+(isTea?'工号':'学号')+'已注册，请直接登录';return}
  const user={u,p,role:authRole,name,cls};users.push(user);DB.set(DB.k.users,users);
  loginAs(user);
};
[$('loginPass'),$('loginUser')].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()}));
function loginAs(user){
  S.user=user;DB.set(DB.k.session,{u:user.u});
  $('authScreen').style.display='none';$('app').classList.add('on');
  $('userPill').innerHTML=`${user.role==='teacher'?'👨‍🏫':'🎓'} ${user.name}`;
  $('userPill').className='pill '+(user.role==='teacher'?'teacher':'role');
  buildNav();go(user.role==='teacher'?'tdash':'home');
}
$('logoutBtn').onclick=()=>{DB.del(DB.k.session);S.user=null;chatHistory=[];
  $('app').classList.remove('on');$('authScreen').style.display='flex';
  $('loginUser').value='';$('loginPass').value='';$('loginErr').textContent=''};
$('menuBtn').onclick=()=>$('side').classList.toggle('open');
window.addEventListener('resize',()=>{$('menuBtn').style.display=innerWidth<=920?'grid':'none'});
$('menuBtn').style.display=innerWidth<=920?'grid':'none';

function applyTheme(t){document.documentElement.setAttribute('data-theme',t);DB.set('sgzj_theme',t)}
$('themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='light'?'dark':'light')};
(function(){const saved=DB.get('sgzj_theme',null);if(saved)applyTheme(saved)})();

$('aiBtn').onclick=()=>{
  const ai=DB.get(DB.k.ai,{proto:'anthropic',base:'https://api.anthropic.com',model:'claude-sonnet-5',key:''});
  openModal(`<h3>🧠 接入真实大模型</h3>
    <p class="muted" style="font-size:.83rem;line-height:1.8;margin-bottom:14px">
    填入 API Key 后，智能问答与作业智能预评将由真实大模型驱动（回答更灵活、可处理开放问题）。支持 Anthropic 协议与 OpenAI 兼容协议（DeepSeek、通义千问、智谱等国内模型）。<br>
    <b style="color:var(--amber)">注意</b>：在线演示链接（沙箱）受安全策略限制无法外联，此时会自动回退到<b>本地知识库</b>；
    请在<b>自行托管或本地打开</b>本页面时使用大模型功能。未填写则始终使用本地知识库。</p>
    <div class="field"><label>接口协议</label><select class="ctl" id="aiProto" style="width:100%"><option value="anthropic" ${(ai.proto||'anthropic')==='anthropic'?'selected':''}>Anthropic Messages（Claude）</option><option value="openai" ${ai.proto==='openai'?'selected':''}>OpenAI 兼容（DeepSeek / 通义 / 智谱 …）</option></select></div>
    <div class="field"><label>API Base URL</label><input id="aiBase" value="${ai.base||'https://api.anthropic.com'}" placeholder="如 https://api.deepseek.com"></div>
    <div class="field"><label>模型</label><input id="aiModel" value="${ai.model||'claude-sonnet-5'}" placeholder="如 deepseek-chat"></div>
    <div class="field"><label>API Key（仅存于本机浏览器）</label><input id="aiKey" type="password" value="${ai.key||''}" placeholder="sk-..."></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">取消</button><span class="spacer"></span>
      <button class="btn" onclick="clearAI()">清除</button>
      <button class="btn primary" style="width:auto" onclick="saveAI()">保存</button></div>`);
};
window.saveAI=()=>{DB.set(DB.k.ai,{proto:$('aiProto').value,base:$('aiBase').value.trim(),model:$('aiModel').value.trim(),key:$('aiKey').value.trim()});
  closeModal();toast($('aiKey').value.trim()?'已保存，问答将尝试调用大模型':'已保存')};
window.clearAI=()=>{DB.del(DB.k.ai);closeModal();toast('已清除，恢复本地知识库')};
window.closeModal=closeModal;

/* ============================================================
   启动
   ============================================================ */
(async function boot(){
  await NET.init();          // 由课堂服务器提供页面时：拉取共享数据并开始同步；否则单机模式
  seed();migrateIds();
  const pill=$('netPill');
  if(pill){pill.style.display='inline-flex';pill.textContent=NET.on?('🌐 课堂服务器'+(NET.admin?' · 教师端':'')):'💾 单机模式';pill.title=NET.on?('已连接 '+NET.studentUrl()+'，全班数据实时汇总到服务器'):'数据仅保存在本机浏览器；双击 ① 启动课堂服务器.bat 可多人同时使用';}
  const sess=DB.get(DB.k.session,null);
  if(sess){const u=DB.get(DB.k.users,[]).find(x=>x.u===sess.u);if(u){loginAs(u);return}}
})();
</script>
</body>
</html>
